section: "4b.1"
text: "Log through [LoggerMessage] source-generated methods with structured values in fields, never secrets; Aw.Redaction scrubs every log line, span and metric before it leaves the process."
why: "Source-generated logging is AOT-safe and allocation-free, and one scrubber on the way out means no call site has to remember to redact."
