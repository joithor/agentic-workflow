schemaVersion: 1
id: engineering.csharp.typed-ids
kind: engineering
section: "4b.3"
text: "Every id and constrained primitive is a Vogen typed value with Vogen's STJ generation off (VogenDefaults), a user-code [JsonConverter] and IParsable<T> declared in user code, plus a JSON round-trip test; the Host maps Vogen's validation exception to a 400."
why: "Decided in R9: source generators can't see each other's output, so Vogen's own STJ and parse generation would silently break JSON and route binding."
select:
  languages: [csharp]
  paths: ["src/**"]
checks:
  - type: test
    id: "TypedIdGuard"
    ref: tests
    status: active
    note: "the guard, in Aw.Architecture.Tests; ARCH-ID-001/002 run it over every registered assembly"
  - type: archunit
    id: "ARCH-ID-001"
    status: active
  - type: archunit
    id: "ARCH-ID-002"
    status: active
gap: partial
gapNote: "The per-id JSON round-trip test and the Host's mapping of Vogen's validation exception to a 400 are written by /new-slice (the id tests and the route binding tests) and reviewed; no check fails a missing one."
source:
  type: adr
  ref: "docs/superpowers/specs/2026-10-09-agent-readiness-design.md#4b3"
status: active
