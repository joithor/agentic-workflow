section: "4b.3"
text: "Every id and constrained primitive is a Vogen typed value with the six VogenDefaults arguments, a user-code [JsonConverter] and IParsable<T> declared in user code, plus a JSON round-trip test."
why: "Decided in R9: source generators can't see each other's output, so Vogen's own STJ and parse generation would silently break JSON and route binding."
