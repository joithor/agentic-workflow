  - type: archunit
    id: "ARCH-ID-002"
    status: pending
    pendingPr: 131
gap: pending
gapNote: "TypedIdGuard covers only Aw.Kernel's own ids on main; ARCH-ID-001/002 run it over every registered assembly."
