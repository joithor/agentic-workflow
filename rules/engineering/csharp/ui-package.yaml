schemaVersion: 1
id: engineering.csharp.ui-package
kind: engineering
section: "4b.1"
text: "The Sindri UI is its own package: views, view models and the API client in Aw.Sindri.Ui, thin platform heads; view models carry no Avalonia types, heads hold no views or view models, compiled bindings only."
why: "View models stay unit-testable, heads stay thin so a new platform is a new head, and compiled bindings keep the app trim- and AOT-safe."
select:
  languages: [csharp]
  paths: ["src/Sindri/Aw.Sindri.Ui/**", "src/Sindri/Aw.Sindri.Ui.Desktop/**"]
checks:
  - type: archunit
    id: "ARCH-UI-001"
    status: active
gap: partial
gapNote: "ARCH-UI-001 covers view models (no Avalonia type) and heads (no view or view model). Compiled bindings (x:DataType everywhere, no ReflectionBinding) rest on the build default, the NativeAOT publish (src/Sindri/Aw.Sindri.Ui.AotSmoke/run.sh) and review."
source:
  type: import
  ref: ".agents/rules/csharp.md"
status: active
