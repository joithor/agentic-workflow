schemaVersion: 1
id: engineering.csharp.warnings-are-errors
kind: engineering
section: "4b.6"
text: "TreatWarningsAsErrors and EnforceCodeStyleInBuild are on, NetAnalyzers come from the pinned package (EnableNETAnalyzers=false, no AnalysisLevel), and every rule's severity is explicit in .editorconfig (bulk error baseline)."
why: "Agents obey errors, not suggestions."
select:
  languages: [csharp]
  paths: ["Directory.Build.props", ".editorconfig"]
checks:
  - type: build-setting
    id: "<EnforceCodeStyleInBuild>true</EnforceCodeStyleInBuild>"
    status: active
  - type: build-setting
    id: "<EnableNETAnalyzers>false</EnableNETAnalyzers>"
    status: active
  - type: build-setting
    id: "dotnet_analyzer_diagnostic.severity = error"
    status: active
gap: partial
gapNote: "The root files set these; a project-level override (NoWarn in a .csproj, a nested .editorconfig lowering a rule) is forbidden by csharp.md and reviewed, not checked; CI's -warnaserror catches a TreatWarningsAsErrors override only."
source:
  type: adr
  ref: "docs/superpowers/specs/2026-10-09-agent-readiness-design.md#4b6"
status: active
