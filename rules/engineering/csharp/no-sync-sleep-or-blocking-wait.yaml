schemaVersion: 1
id: engineering.csharp.no-sync-sleep-or-blocking-wait
kind: engineering
section: "4b.3"
text: "No Thread.Sleep, TaskAwaiter.GetResult, Task.Wait or Task<T>.Result in production code: await instead."
why: "Blocking a thread on a task starves the pool and deadlocks under a synchronization context."
select:
  languages: [csharp]
  paths: ["src/**"]
checks:
  - type: banned-symbols
    id: "RS0030"
    ref: "BannedSymbols.All.txt"
    entries: ["P:System.Threading.Tasks.Task`1.Result", "M:System.Threading.Tasks.Task.Wait", "M:System.Threading.Tasks.Task.Wait(System.Int32)", "M:System.Threading.Tasks.Task.Wait(System.TimeSpan)", "M:System.Threading.Tasks.Task.Wait(System.Threading.CancellationToken)", "M:System.Threading.Tasks.Task.Wait(System.Int32,System.Threading.CancellationToken)", "M:System.Threading.Tasks.Task.Wait(System.TimeSpan,System.Threading.CancellationToken)", "M:System.Threading.Thread.Sleep(System.Int32)", "M:System.Threading.Thread.Sleep(System.TimeSpan)", "M:System.Runtime.CompilerServices.TaskAwaiter.GetResult", "M:System.Runtime.CompilerServices.TaskAwaiter`1.GetResult"]
    status: active
gap: closed
source:
  type: desk
  ref: "https://github.com/davidfowl/AspNetCoreDiagnosticScenarios/blob/master/AsyncGuidance.md"
status: active
