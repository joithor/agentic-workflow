text: "Keep the package shape's direction: Host -> Features -> Core <- Infrastructure; Core references only Aw.Kernel (plus DI abstractions and Vogen)."
why: "A fixed direction keeps domain logic free of adapters and makes the composition root the only place that knows everything."
