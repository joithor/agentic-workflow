schemaVersion: 1
id: engineering.csharp.service-one-use-case
kind: engineering
section: "4b.2"
text: "A service implements IService<TReq, TRes> for one use case; more than 5 constructor dependencies is a split signal, more than 7 is an error."
why: "Small services stay readable for agents and humans; manager services hide coupling."
select:
  languages: [csharp]
  paths: ["src/**"]
checks:
  - type: analyzer
    id: "AW1007"
    status: active
    note: "counts constructor dependencies only: one use case per service stays a review item"
  - type: analyzer
    id: "AW1008"
    status: active
    severity: suggestion
    note: "6-7 dependencies, severity suggestion (the split signal)"
gap: partial
gapNote: "AW1007 fails over 7 constructor dependencies and AW1008 flags 6-7 as a suggestion; one use case per service is reviewed."
source:
