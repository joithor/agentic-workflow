schemaVersion: 1
id: engineering.csharp.await-when-state-needs-it
kind: engineering
section: "4b.3"
text: "A method that returns a task from inside using or try awaits it, so the resource lives until the task finishes and exceptions surface in the try."
why: "Returning the task disposes the resource before the work ends and skips the catch."
