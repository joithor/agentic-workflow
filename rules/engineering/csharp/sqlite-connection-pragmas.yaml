id: engineering.csharp.sqlite-connection-pragmas
kind: engineering
section: "4b.2"
text: "Open connections through Aw.Kernel.Data's SqliteConnectionFactory: read-write gets WAL, busy_timeout, foreign_keys=on and synchronous=NORMAL; read-only gets busy_timeout and query_only; SQLite is the bundled e_sqlite3."
why: "The same SQLite and settings on every machine; read-only opens never rewrite a file header."
