schemaVersion: 1
id: engineering.csharp.tests-use-fake-time
kind: engineering
section: "4b.5"
text: "No DateTime.Now, DateTime.UtcNow, Guid.NewGuid or Thread.Sleep in a test: use FakeTimeProvider, a fake IIdGenerator and a signal."
why: "A test that reads the wall clock or sleeps is slow and flakes."
select:
  languages: [csharp]
  paths: ["tests/**"]
checks:
  - type: review
    id: "fake time in tests"
    status: active
    note: "RS0030 entries land in BannedSymbols.Tests.txt with the cleanup PR"
gap: open
gapNote: "About 74 uses on main. The test-side banned-symbols file lands with the cleanup PR together with the fixes, because a banned symbol with a live use fails the build."
source:
  type: desk
  ref: "https://learn.microsoft.com/dotnet/core/testing/unit-testing-best-practices"
status: active
