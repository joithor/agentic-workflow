schemaVersion: 1
id: engineering.csharp.named-repositories
kind: engineering
section: "4b.2"
text: "One repository interface per aggregate, named by intent; IReadRepository<TEntity, TId> covers Get and Exists; no generic IRepository<T> or IQueryable."
why: "Named queries keep the SQL in one place and the intent visible."
select:
  languages: [csharp]
  paths: ["src/**/*.Core/**", "src/**/*.Infrastructure/**"]
checks:
