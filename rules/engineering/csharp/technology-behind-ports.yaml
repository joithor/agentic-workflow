schemaVersion: 1
id: engineering.csharp.technology-behind-ports
kind: engineering
section: "4b.1"
text: "Every external technology (database, cache, queue, files, processes, HTTP, git, containers, model CLIs, secrets, clock, ids) sits behind a Core port; Core and Features use no technology type, and only Composition uses Infrastructure."
why: "A port with a contract suite makes every technology swappable by adding one adapter."
select:
  languages: [csharp]
  paths: ["src/**"]
checks:
  - type: banned-symbols
    id: "RS0030"
    entries: ["N:System.IO", "N:System.Net", "N:Microsoft.Data", "T:System.Diagnostics.Process"]
    status: active
  - type: archunit
    id: "ARCH-PORT-001"
    status: pending
    pendingPr: 131
  - type: archunit
    id: "ARCH-PORT-002"
    status: pending
    pendingPr: 131
gap: pending
gapNote: "BannedSymbols covers Core's BCL I/O only; Aw.Kernel.Data, SQLitePCL, Npgsql, cache and queue clients, and Features/Commands/Host need the ArchUnitNET rules."
source:
  type: adr
  ref: "docs/superpowers/specs/2026-10-09-agent-readiness-design.md#4b1"
status: active
