schemaVersion: 1
id: engineering.csharp.technology-behind-ports
kind: engineering
section: "4b.1"
text: "Every external technology (database, cache, queue, files, processes, HTTP, git, containers, model CLIs, secrets, clock, ids) sits behind a Core port; Core and Features use no technology type, and only Composition uses Infrastructure."
why: "A port with a contract suite makes every technology swappable by adding one adapter."
select:
  languages: [csharp]
  paths: ["src/**"]
checks:
  - type: banned-symbols
    id: "RS0030"
    entries: ["N:System.IO", "N:System.Net", "N:Microsoft.Data", "T:System.Diagnostics.Process"]
    status: active
  - type: archunit
    id: "ARCH-PORT-001"
    status: active
  - type: archunit
    id: "ARCH-PORT-002"
    status: active
  - type: archunit
    id: "ARCH-ENGINE-001"
    status: active
gap: partial
gapNote: "BannedSymbols and ARCH-PORT-001/002 keep the listed technology types out of Core, Features and App.Commands; a technology missing from that list and a top-level Program's body are reviewed, and each port's contract suite is fakes-with-contract-tests."
source:
  type: import
  ref: ".agents/rules/csharp.md"
status: active
