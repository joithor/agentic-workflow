schemaVersion: 1
id: engineering.csharp.central-package-management
kind: engineering
section: "4b.6"
text: "Central Package Management with exact [x.y.z] pins; analyzers as GlobalPackageReference; new packages at least 14 days old."
why: "One version per package across the solution, and no surprise upgrades."
select:
