  paths: ["Directory.Packages.props"]
checks:
  - type: build-setting
    id: "<ManagePackageVersionsCentrally>true</ManagePackageVersionsCentrally>"
    status: active
  - type: build-setting
    id: "GlobalPackageReference"
    status: active
gap: partial
gapNote: "Nothing checks the [x.y.z] form or the 14-day age; both are reviewed."
source:
