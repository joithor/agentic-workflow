schemaVersion: 1
id: engineering.csharp.no-dispose-before-task-completes
kind: engineering
section: "4b.3"
text: "Never dispose an object that a still-running task uses: await the task inside the scope that owns the object."
why: "Disposing under a running task is a use-after-dispose bug that only shows under load."
