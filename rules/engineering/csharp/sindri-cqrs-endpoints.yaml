schemaVersion: 1
id: engineering.csharp.sindri-cqrs-endpoints
kind: engineering
section: "4b.2"
text: "Every Sindri GET endpoint resolves an IService whose request is an IQuery, and every POST one whose request is an ICommand; an IIssue is allowed only on the four carve-out routes (the workflow nonce and challenge, the session heartbeat and exit), with catalog rows of class 'issue'. The one exception to GET-only queries is the exact-route list EndpointCqrsRules.BodyQueries (POST /sindri/context/subgraph, a query whose keys don't fit a URL)."
why: "Reads never change state and every state change runs through the command chain, so it is gated, authorized, validated and audited."
