schemaVersion: 1
id: engineering.csharp.no-raw-ids-in-public-signatures
kind: engineering
section: "4b.3"
text: "No raw string or Guid id in a public Core or Features signature."
why: "Typed ids make a swapped argument a compile error."
select:
  languages: [csharp]
  paths: ["src/**/*.Core/**", "src/**/*.Features/**"]
checks:
  - type: analyzer
    id: "AW1001"
    status: active
gap: partial
gapNote: "AW1001 catches every Guid and a string whose member is named as an id ('id', '…Id', '…Ids'); a string id under another name is reviewed."
source:
  type: adr
  ref: "docs/superpowers/specs/2026-10-09-agent-readiness-design.md#4b3"
status: active
