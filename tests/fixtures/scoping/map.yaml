# that repo sees the nodes they point at. Today's kinds only (feature, surface, action, thing, code, decision); the four new kinds
# come with S-SK. Note what is NOT here on purpose: no surface for link expiry (the change adds it), and the digest email
# has no 'reads' edge from the share flow (a re-scope must find it by the interview's "other" answer).
