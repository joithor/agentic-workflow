schema: 1
id: workflow.generate-reads
version: 1
inputs:
  - { key: fact:note, type: text, kind: text, generate: "{fact:note} run" }
initial: produce
states:
  produce:
    kind: active
    step: step.produce
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - { from: produce, to: done, on: step.completed, when: { outcome: done } }
displayName: Test recipe
