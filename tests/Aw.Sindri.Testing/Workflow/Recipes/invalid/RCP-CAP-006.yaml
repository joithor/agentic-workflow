schema: 1
id: workflow.cap-006
version: 1
base: { id: workflow.cap-base, hash: "sha256:b8f01b2b6c69841891d80bb45cf9a3f29b64c95d89bf81c0f24b564df323eadc" }
initial: produce
states:
  produce:
    kind: active
    step: step.produce
    loop: revisions
    budget: { tokens: 100k }
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  publish:
    kind: active
    step: step.produce
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  running:
    kind: wait
    waitFor: { child: { recipe: workflow.step, onParked: propagate } }
    timeout: { after: 4h, then: park }
    next: "Waiting for {child}."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - from: produce
    to: publish
    on: step.completed
    when: { outcome: done }
    gates:
      - { use: gate.review, threshold: 0.9 }
      - gate.check
    evidence:
      - { kind: tests, at: head, expect: pass }
    produces: [fact:output]
  - from: produce
    to: produce
    on: step.failed
  - from: publish
    to: running
    on: step.completed
    when: { outcome: done }
    gates: [gate.check]
    effects:
      - use: effect.repo.push
        with: { remote: origin }
  - from: running
    to: done
    on: wait.satisfied
loops: { revisions: { cap: 5 } }
budget: { tokens: 300k }
inputs: [{ key: fact:item, type: item, kind: item }]
