schema: 1
id: workflow.cap-handwritten
version: 1
base: { id: workflow.cap-base, hash: "sha256:b8f01b2b6c69841891d80bb45cf9a3f29b64c95d89bf81c0f24b564df323eadc" }
initial: produce
states:
  produce:
    kind: active
    step: step.produce
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - { from: produce, to: done, on: step.completed, when: { outcome: done }, produces: [fact:output] }
inputs: [{ key: fact:item, type: item, kind: item }]
