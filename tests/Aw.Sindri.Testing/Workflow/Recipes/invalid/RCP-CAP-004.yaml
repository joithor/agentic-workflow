schema: 1
id: workflow.cap-handwritten
version: 1
base: { id: workflow.cap-base, hash: "sha256:84b1571f2b8439caa58c35c4560095bc89b2fde1fef4ae7bd57e59569494ae47" }
initial: produce
states:
  produce:
    kind: active
    step: step.produce
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - { from: produce, to: done, on: step.completed, when: { outcome: done }, produces: [fact:output] }
inputs: [{ key: fact:item, type: item, kind: item }]
