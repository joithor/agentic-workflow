schema: 1
id: workflow.cap-handwritten
version: 1
base: { id: workflow.cap-base, hash: "sha256:16d368e1cdf8ff55142d7c3cb030494a73ad289715cb6f3d5000ae15e631fe23" }
initial: produce
states:
  produce:
    kind: active
    step: step.produce
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
