schema: 1
id: workflow.name-unknown
version: 1
name: "{owner} sweep"
inputs:
  - { key: fact:item, type: item, kind: item }
initial: produce
states:
  produce:
    kind: active
    step: step.produce
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - { from: produce, to: done, on: step.completed, when: { outcome: done } }
displayName: Test recipe
