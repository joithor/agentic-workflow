schema: 1
id: workflow.child-output-path
version: 1
inputs: [{ key: fact:request, label: "Request", type: text, kind: text }]
initial: run
states:
  run: { kind: wait, waitFor: { child: { recipe: workflow.dev-child-summary, inputs: { "fact:request": { fact: fact:request } }, onParked: propagate } }, timeout: { after: 2d, then: park }, next: "Waiting for the child." }
  done: { kind: terminal, outcome: resolved }
  dropped: { kind: terminal, outcome: unresolved }
transitions:
  - { from: run, to: done, on: wait.satisfied, when: { outcome: resolved } }
  - { from: run, to: dropped, on: wait.satisfied, when: { outcome: unresolved }, produces: [fact:output] }
  - { from: run, to: dropped, on: wait.satisfied, when: { outcome: cancelled } }
displayName: Test recipe
