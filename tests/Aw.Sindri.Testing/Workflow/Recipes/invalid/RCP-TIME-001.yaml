schema: 1
id: workflow.time
version: 1
initial: produce
states:
  produce:
    kind: active
    step: step.produce
    next: "Produce the Step output."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - { from: produce, to: done, on: step.completed, when: { outcome: done }, produces: [fact:output] }
inputs: [{ key: fact:item, type: item, kind: item }]
displayName: Test recipe
