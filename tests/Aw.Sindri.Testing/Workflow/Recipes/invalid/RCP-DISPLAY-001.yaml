schema: 1
id: workflow.display-bad
version: 1
displayName: build one phase
initial: produce
states:
  produce:
    kind: active
    step: step.produce
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - { from: produce, to: done, on: step.completed, when: { outcome: done } }
inputs: [{ key: fact:item, type: item, kind: item }]
