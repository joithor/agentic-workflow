schema: 1
id: workflow.input-no-kind
version: 1
inputs:
  - { key: fact:item, type: item }
initial: produce
states:
  produce:
    kind: active
    step: step.produce
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - { from: produce, to: done, on: step.completed, when: { outcome: done } }
displayName: Test recipe
