schema: 1
id: workflow.prove
version: 1
description: "TEMPORARY STAND-IN until sindri-engine's workflow.prove (line spec App. C.4) lands: the hand-test, verify and evidence child waits of the real one, then descriptor-only Steps for the rest; the real inputs, outputs and terminals."
inputs:
  - { key: fact:phasePacket, label: "Phase packet", type: packet,  kind: packet }
  - { key: fact:built,       label: "Built head",   type: payload, kind: payload }
  - { key: fact:workspace,   label: "Workspace",     type: text,    kind: text }
  - { key: fact:redTests,    label: "Red tests",    type: payload, kind: payload }
outputs:
  - { key: fact:proofPack, label: "Proof pack",     type: packet,  from: pack }
  - { key: fact:findings,  label: "Why not proven", type: payload, from: log }
initial: hand-test
states:
  hand-test: { kind: wait, timeout: { after: 2d, then: park },
               waitFor: { child: { recipe: workflow.hand-test, onParked: propagate,
                                   inputs: { "fact:phasePacket": { fact: fact:phasePacket }, "fact:workspace": { fact: fact:workspace } } } },
               next: "Waiting for {child}: {item}'s signals walked by hand in the running app." }
  verify:    { kind: wait, timeout: { after: 1d, then: park },
               waitFor: { child: { recipe: workflow.verify, onParked: propagate,
                                   inputs: { "fact:phasePacket": { fact: fact:phasePacket }, "fact:workspace": { fact: fact:workspace } } } },
               next: "Waiting for {child}: the verify journey on {item}'s head." }
  evidence:  { kind: wait, timeout: { after: 1d, then: park },
               waitFor: { child: { recipe: workflow.evidence, onParked: propagate,
                                   inputs: { "fact:phasePacket": { fact: fact:phasePacket }, "fact:built": { fact: fact:built } } } },
               next: "Waiting for {child}: the evidence that proves {item}." }
  pack:      { kind: active, step: step.standin.prove, timeout: { after: 3h, then: park },
               next: "Stand-in for the rest of {item}'s proof: before and after, hidden scenarios, the proof pack." }
  log:       { kind: active, step: step.standin.prove-log, timeout: { after: 1h, then: park },
               next: "Write what failed in {item}'s proof as findings for its builder." }
  proven:    { kind: terminal, outcome: resolved }
  failed:    { kind: terminal, outcome: unresolved }
transitions:
  - { from: hand-test, to: verify,   on: wait.satisfied, when: { outcome: resolved } }
  - { from: hand-test, to: log,      on: wait.satisfied, when: { outcome: unresolved } }
  - { from: hand-test, to: log,      on: wait.satisfied, when: { outcome: cancelled } }
  - { from: verify,    to: evidence, on: wait.satisfied, when: { outcome: resolved } }
  - { from: verify,    to: log,      on: wait.satisfied, when: { outcome: unresolved } }
  - { from: verify,    to: log,      on: wait.satisfied, when: { outcome: cancelled } }
  - { from: evidence,  to: pack,     on: wait.satisfied, when: { outcome: resolved } }
  - { from: evidence,  to: log,      on: wait.satisfied, when: { outcome: unresolved } }
  - { from: evidence,  to: log,      on: wait.satisfied, when: { outcome: cancelled } }
  - { from: pack, to: proven, on: step.completed, when: { outcome: proven },     produces: [fact:proofPack] }
  - { from: pack, to: log,    on: step.completed, when: { outcome: incomplete } }
  - { from: log,  to: failed, on: step.completed, when: { outcome: logged },     produces: [fact:findings] }
budget: { tokens: 800k }
evals: [evals/workflow.prove/happy.jsonl, evals/workflow.prove/hand-test-fails.jsonl, evals/workflow.prove/evidence-cancelled.jsonl]
