schema: 1
id: workflow.review-loop
version: 3
description: "Block recipe: review the phase's change one lens per run, a round per iteration, to zero blocking and issue findings, at most 5 rounds, then one narrow re-check; a review, clean or behaviour-wrong, ends through a recorded, frozen review packet; no lens applying ends stuck."
displayName: "Review the code until no blocking issues remain"
inputs:
  - { key: fact:change, label: "Change", type: payload, kind: payload }
  - { key: fact:phasePacket, label: "Phase packet", type: packet, kind: packet }
outputs:
  - { key: fact:review, label: "Review result", type: packet, from: record }
initial: round
states:
  round:   { kind: active, step: step.review.round, loop: rounds, timeout: { after: 1h, then: park },
             next: "Start review round {loop.rounds}/{loop.rounds.cap} on {item}'s change: queue the review lenses that apply." }
  lens:    { displayName: "Review pass", why: "One reviewer looks at the change from one angle.", kind: active, step: { use: step.lens.run, with: { subject: change, bundle: lenses } }, loop: lens-runs, timeout: { after: 2h, then: park },
             next: "Review {item}'s change through the next lens in the pack." }
  lens-log: { kind: active, step: step.review.log, timeout: { after: 1h, then: park },
             next: "Append the lens report to {item}'s review rounds and decide: next lens, clean or findings." }
  fix:     { displayName: "Fix the findings", why: "Fixes what the review found.", kind: active, step: step.review.fix, timeout: { after: 4h, then: park },
             next: "Fix the blocking and issue findings of round {loop.rounds}; answer the rest in writing." }
  recheck: { kind: active, step: step.review.recheck, timeout: { after: 1h, then: park },
             next: "Round cap reached: have one reviewer re-check only the fixes." }
  record:  { kind: active, step: step.review.record, timeout: { after: 1h, then: park },
             next: "Write and freeze {item}'s review result packet." }
  clean:   { displayName: "No blocking issues", kind: terminal, outcome: resolved }
  stuck:   { displayName: "Problems remain", kind: terminal, outcome: unresolved }
  wrong:   { displayName: "Behavior is wrong", kind: terminal, outcome: failed }
transitions:
  - { from: round,    to: lens,     on: step.completed, when: { outcome: ready },          produces: [fact:lensQueue, fact:lensRounds] }
  - { from: round,    to: stuck,    on: step.completed, when: { outcome: noLens } }
  - { from: lens,     to: lens-log, on: step.completed, when: { outcome: reviewed },       produces: [fact:lensReport] }
  - { from: lens-log, to: lens,     on: step.completed, when: { outcome: next },           produces: [fact:lensRounds, fact:lensQueue] }
  - { from: lens-log, to: record,   on: step.completed, when: { outcome: clean },          produces: [fact:lensRounds, fact:review] }
  - { label: "problems found: fix them", from: lens-log, to: fix,      on: step.completed, when: { outcome: findings },       produces: [fact:lensRounds, fact:review] }
  - { from: lens-log, to: record,   on: step.completed, when: { outcome: behaviourWrong }, produces: [fact:lensRounds, fact:review] }
  - { label: "fixed: another review pass", from: fix,      to: round,    on: step.completed, when: { all: [ { outcome: fixed }, { loop: rounds, below: cap } ] }, produces: [fact:change] }
  - { from: fix,      to: recheck,  on: step.completed, when: { all: [ { outcome: fixed }, { not: { loop: rounds, below: cap } } ] }, produces: [fact:change] }
  - { from: recheck,  to: record,   on: step.completed, when: { outcome: clean },          produces: [fact:review] }
  - { from: recheck,  to: stuck,    on: step.completed, when: { outcome: findings },       produces: [fact:review] }
  - { from: recheck,  to: record,   on: step.completed, when: { outcome: behaviourWrong }, produces: [fact:review] }
  - { from: record,   to: clean,    on: step.completed, when: { outcome: recorded },       produces: [fact:review] }
  - { from: record,   to: wrong,    on: step.completed, when: { outcome: recordedWrong },  produces: [fact:review] }
loops: { rounds: { cap: 5 }, lens-runs: { cap: 50 } }
evals:
  - evals/workflow.review-loop/happy.jsonl
  - evals/workflow.review-loop/cap-then-recheck.jsonl
  - evals/workflow.review-loop/behaviour-wrong.jsonl
  - evals/workflow.review-loop/recheck-clean.jsonl
  - evals/workflow.review-loop/recheck-wrong.jsonl
  - evals/workflow.review-loop/one-lens-per-run.jsonl
  - evals/workflow.review-loop/empty-queue.jsonl
  - evals/workflow.review-loop/lens-runs-cap.jsonl
