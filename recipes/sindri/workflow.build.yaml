schema: 1
id: workflow.build
version: 1
description: "TEMPORARY STAND-IN until sindri-engine's workflow.build (line spec App. C.3) lands: one descriptor-only Step with the real inputs, outputs and terminals."
inputs:
  - { key: fact:phasePacket, label: "Phase packet (frozen)",       type: packet, kind: packet }
  - { key: fact:workspace,   label: "Phase worktree",              type: text,   kind: text }
  - { key: fact:buildNotes,  label: "Notes from a later station",  type: payload, kind: payload }
  - { key: fact:lineContext, label: "Line context (base, stack parent, run area)", type: payload, kind: payload }
outputs:
  - { key: fact:built,        label: "Built head",           type: payload, from: run }
  - { key: fact:change,       label: "Change under review",  type: payload, from: run }
  - { key: fact:redTests,     label: "Red tests",            type: payload, from: run }
  - { key: fact:activePacket, label: "Phase packet in force", type: packet, from: run }
initial: run
states:
  run:     { kind: active, step: step.standin.build, timeout: { after: 6h, then: park },
             next: "Stand-in for {item}'s builder: build the phase in its worktree." }
  built:   { kind: terminal, outcome: resolved }
  stopped: { kind: terminal, outcome: unresolved }
transitions:
  - { from: run, to: built,   on: step.completed, when: { outcome: built },   produces: [fact:built, fact:change, fact:redTests, fact:activePacket] }
  - { from: run, to: stopped, on: step.completed, when: { outcome: stopped } }
budget: { tokens: 1200k }
evals: [evals/workflow.build/happy.jsonl, evals/workflow.build/stopped.jsonl]
