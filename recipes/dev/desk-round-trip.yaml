schema: 1
id: workflow.dev-desk-round-trip
version: 3
description: "Export a file at the desk, import and check it, and go back to the export with the findings when the check fails: a desk round trip with a loop of two rounds (UI screens, E-22)."
displayName: "Export, check and import a file at the desk"
urgency: work
inputs:
  - { key: fact:request, label: "Request", type: text, kind: text }
outputs:
  - { key: fact:output, label: "Exported file", type: file, from: export }
initial: export
states:
  export: { kind: active, step: step.produce, loop: rounds, timeout: { after: 1h, then: park },
            next: "Export the file for the request (round {loop.rounds}/{loop.rounds.cap}), then complete this Step." }
  import: { kind: active, step: step.checks, timeout: { after: 30m, then: retry },
            next: "Import the file and run the checks." }
  done:   { kind: terminal, outcome: resolved }
transitions:
  - { from: export, to: import, on: step.completed, when: { outcome: done },   produces: [fact:output] }
  - { from: import, to: done,   on: step.completed, when: { outcome: passed } }
  - { from: import, to: export, on: step.completed, when: { outcome: failed }, produces: [fact:findings] }
loops: { rounds: { cap: 2 } }
evals: [evals/workflow.dev-desk-round-trip/happy.jsonl]
