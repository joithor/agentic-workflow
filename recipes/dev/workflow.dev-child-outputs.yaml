schema: 1
id: workflow.dev-child-outputs
version: 2
description: "A parent that waits for a child and keeps its exported file, under its own name, to review it (decision-tree recipes, DT-C)."
displayName: "Keep a child's exported file to review it"
inputs:
  - { key: fact:request, label: "Request", type: text, kind: text }
outputs:
  - { key: fact:exported, label: "Exported file", type: file, from: run }
initial: run
states:
  run:
    kind: wait
    waitFor:
      child:
        recipe: workflow.dev-child-summary
        inputs: { "fact:request": { fact: fact:request } }
        onParked: propagate
    timeout: { after: 2d, then: park }
    next: "Waiting for the export of {item}: run `sindri workflow status {instance}`."
  review:  { kind: active, step: step.verify, timeout: { after: 1d, then: park },
             next: "Review the exported file for {item}, then complete this Step." }
  done:     { kind: terminal, outcome: resolved }
  unproven: { kind: terminal, outcome: unresolved }
  dropped:  { kind: terminal, outcome: unresolved }
transitions:
  - { from: run,    to: review,   on: wait.satisfied, when: { outcome: resolved }, produces: [fact:output, { fact: fact:exported, from: fact:output }] }
  - { from: run,    to: dropped,  on: wait.satisfied, when: { outcome: unresolved } }
  - { from: run,    to: dropped,  on: wait.satisfied, when: { outcome: cancelled } }
  - { from: review, to: done,     on: step.completed, when: { all: [{ outcome: accepted }, { fact: fact:exported, is: present }] } }
  - { from: review, to: unproven, on: step.completed, when: { outcome: accepted } }
  - { from: review, to: dropped,  on: step.completed, when: { outcome: rejected } }
evals: [evals/workflow.dev-child-outputs/happy.jsonl, evals/workflow.dev-child-outputs/unresolved.jsonl]
