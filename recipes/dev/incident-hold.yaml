schema: 1
id: workflow.dev-incident-hold
version: 3
description: "An incident held at the desk until it is answered: one desk Step with a seven day timeout that parks, and a file output (UI screens, E-21)."
displayName: "Hold an incident until you answer"
urgency: incident
inputs:
  - { key: fact:incident, label: "Incident", type: text, kind: text, generate: "incident {start:date} {start:time}" }
outputs:
  - { key: fact:output, label: "Incident report", type: file, from: hold }
initial: hold
states:
  hold: { kind: active, step: step.produce, timeout: { after: 7d, then: park },
          next: "Hold here until the incident is answered; write the report, then complete this Step." }
  done: { kind: terminal, outcome: resolved }
transitions:
  - { from: hold, to: done, on: step.completed, when: { outcome: done }, produces: [fact:output] }
evals: [evals/workflow.dev-incident-hold/happy.jsonl]
