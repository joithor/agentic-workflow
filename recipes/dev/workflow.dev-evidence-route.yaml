schema: 1
id: workflow.dev-evidence-route
version: 2
description: "Route a change to the evidence that proves it: a judge picks one of six branches, and a person picks at the desk when it is unsure or fails (decision-tree recipes, DT-V1)."
displayName: "Route a change to the proof that fits"
name: "evidence route - {start:date} {start:time}"
inputs:
  - { key: fact:change, label: "Change", type: text, kind: text }
  - { key: fact:diff, label: "Diff", type: link, kind: link }
initial: route-evidence
states:
  route-evidence:
    kind: active
    step:
      use: step.judge.choose
      with:
        prompt: "Which evidence proves this change works?"
        facts: [fact:change, fact:diff]
        choices:
          - "ui: what a user sees or does in a web app changed"
          - "api: an HTTP or CLI contract changed: a route, a verb, an exit code or a response shape"
          - "db: what is persisted changed: a schema, a migration, or the rows a command writes"
          - "all: more than one of ui, api and db changed"
          - "none: the always-run checks already prove it (the verify pack, or the frozen bug check)"
          - "other: none of these would prove it"
    timeout: { after: 2d, then: park }
    next: "Pick the evidence for {item}: run `sindri workflow status {instance}` for the choices."
  route-evidence-desk:
    kind: active
    step: { use: step.desk.choose, with: { from: route-evidence } }
    timeout: { after: 2d, then: park }
    next: "Pick the evidence that proves {item}. Each choice shows the model's lean, if it had one."
  evidence-ui:    { kind: active, step: step.produce, timeout: { after: 1d, then: park }, next: "Run the UI evidence for {item}, then complete this Step." }
  evidence-api:   { kind: active, step: step.produce, timeout: { after: 1d, then: park }, next: "Run the API evidence for {item}, then complete this Step." }
  evidence-db:    { kind: active, step: step.produce, timeout: { after: 1d, then: park }, next: "Run the database evidence for {item}, then complete this Step." }
  evidence-all:   { kind: active, step: step.produce, timeout: { after: 1d, then: park }, next: "Run the UI, API and database evidence for {item}, then complete this Step." }
  evidence-none:  { kind: active, step: step.produce, timeout: { after: 1d, then: park }, next: "Write down that the always-run checks are the proof for {item}, then complete this Step." }
  evidence-other: { kind: active, step: step.produce, timeout: { after: 1d, then: park }, next: "Say why no listed evidence proves {item}, then complete this Step." }
  proven:   { kind: terminal, outcome: resolved }
  unproven: { kind: terminal, outcome: unresolved }
transitions:
  - { from: [route-evidence, route-evidence-desk], to: evidence-ui,    on: step.completed, when: { outcome: ui },    produces: [fact:decision] }
  - { from: [route-evidence, route-evidence-desk], to: evidence-api,   on: step.completed, when: { outcome: api },   produces: [fact:decision] }
  - { from: [route-evidence, route-evidence-desk], to: evidence-db,    on: step.completed, when: { outcome: db },    produces: [fact:decision] }
  - { from: [route-evidence, route-evidence-desk], to: evidence-all,   on: step.completed, when: { outcome: all },   produces: [fact:decision] }
  - { from: [route-evidence, route-evidence-desk], to: evidence-none,  on: step.completed, when: { outcome: none },  produces: [fact:decision] }
  - { from: [route-evidence, route-evidence-desk], to: evidence-other, on: step.completed, when: { outcome: other }, produces: [fact:decision] }
  - { from: route-evidence, to: route-evidence-desk, on: step.completed, when: { outcome: uncertain }, produces: [fact:decision] }
  - { from: route-evidence, to: route-evidence-desk, on: step.failed }
  - { from: [evidence-ui, evidence-api, evidence-db, evidence-all, evidence-none], to: proven, on: step.completed, when: { outcome: done }, produces: [fact:output] }
  - { from: evidence-other, to: unproven, on: step.completed, when: { outcome: done }, produces: [fact:output] }
evals:
  - evals/workflow.dev-evidence-route/happy.jsonl
  - evals/workflow.dev-evidence-route/api.jsonl
  - evals/workflow.dev-evidence-route/db.jsonl
  - evals/workflow.dev-evidence-route/all.jsonl
  - evals/workflow.dev-evidence-route/none.jsonl
  - evals/workflow.dev-evidence-route/other.jsonl
  - evals/workflow.dev-evidence-route/uncertain.jsonl
  - evals/workflow.dev-evidence-route/failed.jsonl
