schema: 1
id: workflow.dev-triage-three-state
version: 3
description: "A triage item through a desk Step, a question to the human and a terminal: three states, a file output and a decision output (UI screens, E-21 and E-22)."
displayName: "Triage an item in three states"
urgency: triage
name: "{fact:scope} - {start:date}"
inputs:
  - { key: fact:scope, label: "Scope", type: text, kind: text }
  - { key: fact:item, label: "Item", type: item, kind: item }
outputs:
  - { key: fact:output, label: "Draft", type: file, from: desk }
  - { key: fact:answer, label: "Decision", type: decision, from: answer }
initial: desk
states:
  desk:   { kind: active, step: step.produce, timeout: { after: 1h, then: park },
            next: "Write the draft for {item}, then complete this Step." }
  answer: { kind: wait, waitFor: { answer: { id: accept, question: "Accept the draft?" } }, timeout: { after: 1d, then: park },
            next: "Waiting for your answer on the draft." }
  done:   { kind: terminal, outcome: resolved }
transitions:
  - { from: desk,   to: answer, on: step.completed, when: { outcome: done }, produces: [fact:output] }
  - { from: answer, to: done,   on: wait.satisfied, when: { outcome: answered }, produces: [fact:answer] }
evals: [evals/workflow.dev-triage-three-state/happy.jsonl]
