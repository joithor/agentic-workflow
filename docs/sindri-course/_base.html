  <!--
    CUSTOMIZE PER COURSE — change only the three accent variables below.
    Options:
      vermillion  #D94F30 / #C4432A / #FDEEE9 / #E8836C  (default)
      coral       #E06B56 / #C85A47 / #FDECEA / #E89585
      teal        #2A7B9B / #1F6280 / #E4F2F7 / #5A9DB8
      amber       #D4A843 / #BF9530 / #FDF5E0 / #E0C070
      forest      #2D8B55 / #226B41 / #E8F5EE / #5AAD7A
  -->
  <style>
    :root {
      --color-accent:       #D94F30;
      --color-accent-hover: #C4432A;
      --color-accent-light: #FDEEE9;
      --color-accent-muted: #E8836C;
    }
    /* Sindri-only: build-status chips (built / building / specced / designed / dream) */
    .status { display: inline-block; font: 600 0.7rem/1 var(--font-mono); letter-spacing: .04em; text-transform: uppercase;
      padding: 3px 7px; border-radius: 99px; vertical-align: middle; margin-left: 6px; white-space: nowrap; }
    .status.built    { background: #E8F5EE; color: #226B41; }
    .status.building { background: #E2F4F1; color: #0F6B66; }
    .status.specced  { background: #E4F2F7; color: #1F6280; }
    .status.designed { background: #FDF5E0; color: #8A6A1C; }
    .status.dream    { background: #EFEBF7; color: #5E528A; }
    .bars { display: flex; flex-direction: column; gap: 6px; margin: var(--space-6) 0; }
    .bar-row { display: grid; grid-template-columns: minmax(120px, 15rem) 1fr 3rem; gap: 10px; align-items: center; font-size: var(--text-sm); }
    .bar-track { height: 14px; background: var(--color-border-light); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--color-accent); border-radius: 99px; }
    .bar-fill.cool { background: var(--color-actor-2); }
    .bar-row span:last-child { font-family: var(--font-mono); color: var(--color-text-secondary); text-align: right; }
    .ref { font: 500 0.72rem var(--font-mono); color: var(--color-text-muted); }
    @media (max-width: 560px) { .bar-row { grid-template-columns: 1fr 3rem; } .bar-row .bar-track { grid-column: 1 / -1; grid-row: 2; } }
  </style>

  <script src="main.js" defer></script>
</head>
