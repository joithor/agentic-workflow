<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sindri</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#010102;
  --s1:#0f1011; --s2:#141516; --s3:#18191a; --s4:#191a1b;
  --line1:#23252a; --line2:#34343a; --line3:#3e3e44;
  --ink:#f7f8f8; --ink-muted:#d0d6e0; --ink-subtle:#8a8f98; --ink-tertiary:#62666d;
  --brand:#5e6ad2; --brand-hover:#828fff; --focus:#828fff; --link:#828fff;
  --brand-hover-fill:#535fc6; --brand-pressed:#4c57be; --error:#eb5757;
  --success:#27a644; --soft:#1d2036;
  --attn:#f2994a; --attn-soft:rgba(242,153,74,.14);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --pd:0ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.4;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv01","ss03"}
body{overflow-x:hidden;min-height:100vh}
button,input,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.mono,code{font-family:var(--mono);font-size:12px;letter-spacing:-.1px;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
kbd{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--ink-subtle);
  border:1px solid var(--line2);border-radius:4px;padding:0 4px;min-width:16px;height:16px;
  display:inline-flex;align-items:center;justify-content:center;background:var(--s2);line-height:1}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{height:48px;display:flex;align-items:center;gap:14px;padding:0 16px;
  border-bottom:1px solid var(--line1);background:var(--canvas);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;letter-spacing:-.2px}
.brand-mark{width:20px;height:20px;border-radius:5px;background:var(--brand);display:grid;place-items:center}
.seg{display:flex;align-items:center;gap:2px;padding:2px;background:var(--s1);border:1px solid var(--line1);border-radius:8px}
.seg.off{opacity:.4;pointer-events:none}
.seg a,.seg button{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;
  color:var(--ink-subtle);font-weight:500;font-size:13px;text-decoration:none}
.seg a:hover,.seg button:hover{color:var(--ink-muted);background:var(--s2)}
.seg a[aria-current="page"]{color:var(--ink);background:var(--s3);box-shadow:inset 0 0 0 1px var(--line2)}
.seg a[aria-current="page"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}
.count-attn{font-size:11px;font-weight:600;color:var(--attn);background:var(--attn-soft);
  border-radius:4px;padding:0 5px;height:16px;display:inline-flex;align-items:center}
.count{font-size:11px;font-weight:500;color:var(--ink-subtle)}
.chord{font-size:12px;color:var(--ink-muted);display:none;align-items:center;gap:4px;white-space:nowrap}
.chord.on{display:inline-flex}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;width:220px;white-space:nowrap;height:30px;padding:0 8px 0 10px;
  border:1px solid var(--line1);border-radius:8px;background:var(--s1);color:var(--ink-subtle);text-align:left}
.search:hover{border-color:var(--line2)}
.search span{flex:1}
.health{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--line1);
  border-radius:8px;background:var(--s1);white-space:nowrap;font-size:12px}
.health:hover{border-color:var(--line2)}
.health .ok{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500;font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block}
.dot.deg{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-muted)}
.health .sep{width:1px;height:14px;background:var(--line2)}
.health .fail{display:flex;align-items:center;gap:5px;color:var(--ink-muted)}
.health .fail svg{color:var(--error)}
.health .age{color:var(--ink-subtle)}
.attn-band{height:2px;background:transparent}
.attn-band.on{background:var(--attn);animation:breathe 1.6s ease-in-out infinite;animation-delay:var(--pd)}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}

/* page */
.page{max-width:1264px;margin:0 auto;padding:0 40px 64px 16px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 0 10px;gap:16px}
.pagehead h1{font-size:20px;font-weight:600;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.pagehead .sub{color:var(--ink-subtle);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pagehead .sub b{color:var(--ink-muted);font-weight:500}
.attn-word{color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.attn-word i{width:6px;height:6px;border-radius:50%;background:var(--attn)}
.hints{display:flex;gap:12px;color:var(--ink-subtle);font-size:12px;white-space:nowrap}
.hints span{display:flex;align-items:center;gap:4px}

/* panels */
.panel{background:var(--s1);border:1px solid var(--line1);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.phead{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-bottom:1px solid var(--line1)}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-muted)}
.phead .meta{margin-left:auto;color:var(--ink-subtle);font-size:12px;display:flex;gap:10px;align-items:center}
.row2{display:grid;grid-template-columns:1.5fr 1fr;gap:8px;margin-top:8px}
.empty{padding:18px 16px;text-align:center;color:var(--ink-muted);font-size:13px}
.empty kbd{margin-left:4px}

/* rows: shared focus */
[data-row]{outline:none;cursor:default}
[data-row]:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:8px}
[data-row].cur{background:var(--s2)}
.ttl{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;cursor:pointer;padding:0;border-radius:4px}
.ttl:hover{text-decoration:underline;text-decoration-color:var(--line3);text-underline-offset:3px}

/* needs-you rows */
.ny{position:relative;display:grid;grid-template-columns:104px minmax(0,1fr) 60px auto;gap:12px;align-items:center;
  padding:6px 16px 6px 18px;border-top:1px solid var(--line1)}
.ny:first-of-type{border-top:0}
.ny:hover{background:var(--s2)}
.ny .bar{position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0}
.ny.pulse .bar{background:var(--attn);animation:pulse 1.6s ease-in-out infinite;animation-delay:var(--pd)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ny.colour .bar,.ny.seen .bar{background:var(--attn)}
.ny.calm .bar{background:var(--ink-subtle)}
.ny.enter{animation:slidein .18s cubic-bezier(.2,0,0,1)}
@keyframes slidein{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.kind{display:flex;flex-direction:column;gap:3px}
.chip{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;height:20px;padding:0 6px;
  border-radius:4px;border:1px solid var(--line2);background:var(--s2);font-size:11.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.chip .g{color:var(--ink-subtle);font-size:10px}
.motion{font-size:11px;color:var(--ink-subtle);white-space:nowrap;display:flex;gap:5px;align-items:center}
.newword{display:none;font-size:10.5px;font-weight:600;color:var(--ink);border:1px solid var(--attn);border-radius:4px;padding:0 5px;height:16px;align-items:center}
.what{min-width:0}
.line1{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
.line1>*{flex:none}
.line1 .ttl{flex:0 1 auto;min-width:0}
.line1 .rest{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--ink-subtle)}
.id{color:var(--ink-subtle);white-space:nowrap}
.line2{color:var(--ink-subtle);margin-top:2px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.line2 .reason{color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:0 6px;color:var(--ink-subtle);height:18px;display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.since{color:var(--ink-subtle);font-size:11px;text-align:right;line-height:1.3;white-space:nowrap}
.since b{display:block;color:var(--ink-muted);font-weight:500;font-size:12.5px}
.acts{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.okline{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted);white-space:nowrap}
.okline svg{color:var(--success)}
.okline b{color:var(--ink);font-weight:500}
.rm .ny.pulse .bar{animation:none;background:var(--attn)}
.rm .ny.pulse{box-shadow:inset 0 0 0 2px var(--attn);border-radius:8px}
.rm .ny.pulse .newword{display:inline-flex}
.rm .attn-band.on{animation:none}
.rm *{transition-duration:0s!important}
.rm .ny.enter{animation:none}
.showall{padding:8px 16px;border-top:1px solid var(--line1);display:flex;justify-content:space-between;color:var(--ink-subtle);font-size:12px}
.linkbtn{color:var(--link);font-size:12px;padding:0;border-radius:4px}
.linkbtn:hover{text-decoration:underline}

/* buttons */
.btn{height:28px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line2);background:var(--s3);color:var(--ink-muted);white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--s4);border-color:var(--line3);color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-hover-fill);border-color:var(--brand-hover-fill)}
.btn.primary:active{background:var(--brand-pressed);border-color:var(--brand-pressed)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-subtle)}
.btn.ghost:hover{color:var(--ink-muted);background:var(--s2)}
.btn[disabled],.btn[aria-disabled="true"]{color:var(--ink-tertiary);background:var(--s2);border-color:var(--line1);cursor:not-allowed}
.btn.primary[disabled].busy{background:var(--brand-pressed);border-color:var(--brand-pressed);color:#fff;cursor:progress}
.btn.busy{cursor:progress}
.btn kbd{margin-left:1px}
.btn.primary kbd{color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.35);background:transparent}
.btn.term{background:var(--s2);color:var(--ink)}
.btn.term svg{color:var(--ink-subtle)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.danger{color:var(--ink)}
.btn.danger .x{color:var(--error)}
.btn.dangerfill{background:var(--s3);border-color:var(--error);color:var(--error)}
.btn.dangerfill:hover{background:rgba(235,87,87,.12);color:#ff8a8a}
.split{position:relative;display:inline-flex}
.split .main{border-radius:8px 0 0 8px}
.split .chev{border-radius:0 8px 8px 0;border-left-color:var(--line1);padding:0 6px;margin-left:-1px}
.split .btn.primary.chev{border-left-color:rgba(255,255,255,.18)}
.warp{width:12px;height:12px;border-radius:3px;background:var(--s4);border:1px solid var(--line3);display:inline-grid;place-items:center}
.spin{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .9s linear infinite;display:inline-block}
.btn:not(.primary) .spin{border-color:var(--line3);border-top-color:var(--ink-muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.cmd{display:inline-flex;align-items:center;margin-top:4px;height:22px;border:1px solid var(--line1);border-radius:6px;background:var(--canvas);max-width:100%}
.cmd .prompt{font-family:var(--mono);font-size:11px;color:var(--ink-subtle);padding:0 0 0 8px}
.cmd code{font-size:11.5px;color:var(--ink-muted);padding:0 8px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd button{height:100%;padding:0 8px;border-left:1px solid var(--line1);color:var(--ink-subtle);display:flex;align-items:center;gap:4px;font-size:11.5px;white-space:nowrap;border-radius:0 6px 6px 0}
.cmd button:hover{color:var(--ink);background:var(--s3)}
.cmd.wrap{height:auto;align-items:stretch}
.cmd.wrap .prompt{padding-top:5px}
.cmd.wrap code{white-space:normal;padding:5px 8px 5px 6px;line-height:1.45;word-break:break-word}
.pending{font-size:11px;color:var(--ink-subtle);border:1px dashed var(--line2);border-radius:4px;padding:1px 6px;white-space:nowrap}
.engine{font-size:10.5px;color:var(--ink-subtle);border:1px dashed var(--line3);border-radius:4px;padding:0 5px;white-space:nowrap;height:16px;display:inline-flex;align-items:center}
.nowarp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted);white-space:nowrap}
.nowarp .x{color:var(--error)}
.stalemark{font-size:11px;color:var(--ink-muted);border:1px solid var(--line2);border-radius:4px;padding:0 5px;height:18px;display:inline-flex;align-items:center;gap:4px}
.is-stale .ttl,.is-stale .reason{color:var(--ink-subtle)}

/* running */
.run{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;padding:5px 16px;border-top:1px solid var(--line1);align-items:center}
.run:first-of-type{border-top:0}
.run:hover{background:var(--s2)}
.step{display:flex;gap:6px;align-items:center;color:var(--ink-subtle);margin-top:2px;white-space:nowrap;overflow:hidden;font-size:12px}
.step .mono{color:var(--ink-muted)}
.state{display:inline-flex;align-items:center;gap:5px;font-weight:500;color:var(--ink);font-size:12px;white-space:nowrap}
.state .g{color:var(--ink-subtle);font-size:10px}
.state.live .g{color:var(--success)}
.budget{grid-column:1/-1;display:flex;align-items:center;gap:10px;color:var(--ink-subtle);font-size:11.5px}
.budget .track{flex:1;height:3px;border-radius:2px;background:var(--line1);overflow:hidden}
.budget .fill{height:100%;background:var(--ink-subtle)}
.sentline{grid-column:1/-1;display:flex;align-items:center;gap:6px;color:var(--ink-subtle);font-size:11.5px;white-space:nowrap;overflow:hidden}
.sentline svg{color:var(--success)}
.sentline code{color:var(--ink-muted);font-size:11px}

/* queued */
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:5px 16px;border-top:1px solid var(--line1);align-items:center}
.q:first-of-type{border-top:0}
.q:hover{background:var(--s2)}
.q .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:baseline;min-width:0}
.q .sub{color:var(--ink-subtle);font-size:11.5px}
.qfoot{padding:8px 16px;border-top:1px solid var(--line1);color:var(--ink-subtle);font-size:12px;display:flex;justify-content:space-between;align-items:center}

/* health strip */
.strip{display:flex;align-items:stretch;margin-top:8px;background:var(--s1);border:1px solid var(--line1);border-radius:12px;overflow:hidden;width:100%;text-align:left}
.strip:hover{border-color:var(--line2)}
.strip .hd{display:flex;align-items:center;gap:8px;padding:0 14px;border-right:1px solid var(--line1);white-space:nowrap}
.cell{flex:1 1 auto;padding:6px 12px;border-right:1px solid var(--line1);min-width:0}
.cell:last-child{border-right:0}
.cell .k{font-size:11px;color:var(--ink-subtle);display:block}
.cell .v{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;font-size:12.5px}
.cell .v .mono{font-weight:400;color:var(--ink-muted)}
.cell .v.warn{color:var(--ink-muted)}
.cell .v .x{color:var(--error)}

/* banners */
.banner{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--s2);margin-top:10px}
.banner .w{font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.banner .t{color:var(--ink-muted);flex:1}
.banner .t code{color:var(--ink)}
.banner .aside{color:var(--ink-subtle);font-size:12px;white-space:nowrap}
.banner.err{border-color:var(--line3);background:var(--s3);box-shadow:inset 2px 0 0 var(--error)}
.banner.err .x{color:var(--error)}
.prog{height:3px;background:var(--line1);border-radius:2px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ink-subtle);transition:width .3s linear}

/* centre cards (not running, version) */
.center{min-height:calc(100vh - 140px);display:grid;place-items:center}
.card{width:440px;background:var(--s1);border:1px solid var(--line1);border-radius:12px;padding:20px 22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.card h2{font-size:17px;font-weight:600;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.card p{color:var(--ink-muted);margin-top:6px;font-size:13px}
.help{font-size:12px;color:var(--ink-subtle);margin-top:8px}
.vers{display:grid;grid-template-columns:80px 1fr;gap:4px 10px;margin-top:10px;font-size:12px}
.vers .k{color:var(--ink-subtle)}
.vers .v{font-family:var(--mono);color:var(--ink)}
.sk{background:var(--s3);border-radius:4px;height:10px;position:relative;overflow:hidden;display:block}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:shim 1.4s linear infinite}
.rm .sk::after{animation:none}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.skrow{display:grid;grid-template-columns:90px 1fr 60px 300px;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line1)}
.skrow:first-of-type{border-top:0}

/* cli block */
.cliblock{border:1px solid var(--line2);border-radius:8px;background:var(--canvas);overflow:hidden}
.cliblock .row{display:flex;align-items:center;gap:8px;min-height:36px;padding:6px 6px 6px 10px}
.cliblock code{font-size:11.5px;color:var(--ink);flex:1;white-space:normal;word-break:break-word}
.cliblock .term-g{color:var(--ink-subtle);display:flex}
.cliblock .prompt{font-family:var(--mono);font-size:12px;color:var(--ink-subtle)}
.cliblock .foot{display:flex;align-items:center;gap:6px;padding:7px 10px;border-top:1px solid var(--line1);background:var(--s2);font-size:12px;color:var(--ink-muted)}
.cliblock .foot .btn{margin-left:auto}
.lockline{display:flex;align-items:center;gap:6px}

/* sheet */
.sheet-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;
  background:var(--s2);border:1px solid var(--line2);border-right:0;border-radius:8px 0 0 8px;
  padding:10px 4px;color:var(--ink-subtle);font-size:11px;display:flex;gap:6px;align-items:center;z-index:15}
.sheet-tab:hover{color:var(--ink-muted);background:var(--s3)}
.sheet{position:fixed;top:50px;right:0;bottom:0;width:520px;background:var(--s1);border-left:1px solid var(--line1);
  display:flex;flex-direction:column;z-index:25;animation:sheetin .18s cubic-bezier(.2,0,0,1)}
.rm .sheet{animation:none}
@keyframes sheetin{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:1100px){.sheet{width:100%}}
.sh-head{padding:14px 20px 12px;border-bottom:1px solid var(--line1)}
.sh-top{display:flex;align-items:center;gap:8px}
.sh-top .close{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--ink-subtle);font-size:12px;padding:2px 4px;border-radius:6px}
.sh-top .close:hover{color:var(--ink)}
.sh-title{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.sh-title .id{color:var(--ink-subtle)}
.sh-title h2{font-size:17px;font-weight:600;letter-spacing:-.3px;color:var(--ink)}
.sh-meta{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--ink-subtle);font-size:12px;flex-wrap:wrap}
.stateword{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:500;font-size:12px}
.sh-body{flex:1;overflow:auto;padding:14px 20px 20px;display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sec-h .r{margin-left:auto;font-size:11px;color:var(--ink-subtle)}
.inst{background:var(--canvas);border:1px solid var(--line1);border-radius:8px;padding:9px 12px;font-family:var(--mono);
  font-size:11.5px;line-height:1.55;color:var(--ink-muted)}
.inst .hdr{color:var(--ink);white-space:pre-wrap}
.inst .ln{display:grid;grid-template-columns:72px 1fr;white-space:pre-wrap}
.inst .ln .k{color:var(--ink-subtle)}
.inst .ln .v.next{color:var(--ink)}
.kv{display:grid;grid-template-columns:110px 1fr auto;gap:6px 10px;align-items:center;font-size:12px}
.kv .k{color:var(--ink-subtle)}
.kv .v{color:var(--ink-muted)}
.kv .track{height:4px;border-radius:2px;background:var(--line1);overflow:hidden;width:120px;display:block}
.kv .fill{height:100%;background:var(--ink-subtle);display:block}
.sh-foot{border-top:1px solid var(--line1);padding:10px 20px 40px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--s1)}
.sh-foot .note{flex-basis:100%;font-size:11px;color:var(--ink-subtle);line-height:1.35}
.tl{display:flex;flex-direction:column;gap:5px;font-size:12px}
.tl div{display:grid;grid-template-columns:40px 150px 1fr;gap:8px;color:var(--ink-subtle)}
.tl .t{font-family:var(--mono);font-size:11px;color:var(--ink-subtle)}
.tl .e{font-family:var(--mono);font-size:11px;color:var(--ink-muted)}
.ansform textarea{width:100%;resize:vertical;min-height:66px;background:var(--canvas);border:1px solid var(--line2);border-radius:8px;
  padding:8px 10px;color:var(--ink);font:13px/1.45 var(--sans)}
.ansform textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ansform textarea[disabled]{color:var(--ink-muted)}
.formrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.formrow .counter{color:var(--ink-subtle);font-size:11px}
.formrow .btn.primary{margin-left:auto}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line1);border-radius:8px;background:var(--s2)}
.notice .ic{margin-top:1px;color:var(--ink-muted)}
.notice .ic.ok{color:var(--success)}
.notice .t{flex:1;min-width:0}
.notice .t b{color:var(--ink);font-weight:500}
.notice .t p{color:var(--ink-subtle);font-size:12px;margin-top:2px}
.notice .t p code,.notice .t code{color:var(--ink-muted);font-size:11.5px}
.notice.fail{border-color:var(--line2);box-shadow:inset 2px 0 0 var(--error)}
.notice.fail .ic{color:var(--error)}
.codechip{font-family:var(--mono);font-size:11px;color:var(--ink-muted);border:1px solid var(--line2);border-radius:4px;padding:0 5px;margin-left:6px;font-weight:400}
.detail{font-family:var(--mono);font-size:11.5px;color:var(--ink-subtle);margin-top:3px}
.fixrow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.fixrow .lbl{font-size:12px;color:var(--ink-subtle)}
.lb-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lb-foot{margin-top:8px;font-size:12px;color:var(--ink-subtle);line-height:1.5}
.lb-foot code{color:var(--ink-muted);font-size:11.5px}
.reqtext{background:var(--s2);border:1px solid var(--line1);border-radius:8px;overflow:hidden}
.reqtext .src{font-size:11px;color:var(--ink-subtle);padding:4px 10px;border-bottom:1px solid var(--line1)}
.reqtext p{padding:7px 10px;color:var(--ink-muted);font-size:12.5px;white-space:pre-wrap}
.opts{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.recm{font-size:11px;color:var(--ink-subtle);display:inline-flex;gap:4px;align-items:center}
.note-in{height:28px;width:100%;border:1px solid var(--line2);border-radius:8px;background:var(--canvas);color:var(--ink);padding:0 10px;font-size:12px}
.note-in::placeholder{color:var(--ink-subtle)}
.rec{font-size:11px;border:1px dashed var(--line3);border-radius:6px;padding:0 6px;height:18px;display:inline-flex;align-items:center;gap:5px;color:var(--ink-muted)}
.cleared{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--s2);font-size:12px;color:var(--ink-muted)}
.cleared svg{color:var(--success)}

/* menus, popovers */
.overlay-layer{position:fixed;inset:0;pointer-events:none;z-index:60}
.overlay-layer>*{pointer-events:auto}
.menu{position:fixed;z-index:61;width:372px;background:var(--s3);border:1px solid var(--line2);
  border-radius:8px;padding:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.menu .cap2{padding:6px 8px 4px;font-size:11px;color:var(--ink-subtle)}
.mi{display:grid;grid-template-columns:16px 1fr auto;gap:2px 8px;align-items:start;padding:7px 8px;border-radius:6px;color:var(--ink-muted);width:100%;text-align:left}
.mi:hover,.mi:focus-visible{background:var(--s4)}
.mi:focus-visible{outline-offset:-2px}
.mi .ck{color:var(--ink);padding-top:1px}
.mi .lab{color:var(--ink);font-weight:500;display:flex;align-items:center}
.mi .why{grid-column:2/3;font-size:12px;color:var(--ink-subtle)}
.mi.off{cursor:not-allowed}
.mi.off .lab{color:var(--ink-subtle)}
.mi .limited{font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--ink-muted);margin-left:6px;font-weight:400}
.mi .xmark{color:var(--error);margin-right:4px}
.menu hr{border:0;border-top:1px solid var(--line1);margin:4px 0}
.menu .mfoot{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 4px;font-size:11px;color:var(--ink-subtle)}
.later .mi .lab{color:var(--ink-subtle)}
.pop{position:fixed;z-index:62;width:320px;background:var(--s4);border:1px solid var(--line2);border-radius:12px;padding:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.pop h3{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.pop h3 .x{color:var(--error)}
.pop p{color:var(--ink-muted);font-size:12px;margin-top:4px}
.pop .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:grid;place-items:start center;padding-top:96px}
.dialog{width:440px;background:var(--s4);border:1px solid var(--line2);border-radius:12px;padding:18px 20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.dialog h2{font-size:16px;font-weight:600;letter-spacing:-.2px;display:flex;gap:8px;align-items:center}
.dialog h2 .x{color:var(--error)}
.dialog p{color:var(--ink-muted);margin-top:8px}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-top:12px;font-size:12px}
.keys div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 0;border-bottom:1px solid var(--line1);color:var(--ink-muted)}
.keys span:last-child{display:flex;gap:3px}
.dialog.wide{width:640px}

/* palette */
.pal{position:fixed;left:50%;top:84px;transform:translateX(-50%);width:600px;max-width:calc(100vw - 32px);background:var(--s3);border:1px solid var(--line2);border-radius:12px;z-index:80;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.pal-in{display:flex;align-items:center;gap:8px;padding:0 14px;height:46px;border-bottom:1px solid var(--line1);color:var(--ink-subtle)}
.pal-in input{flex:1;height:100%;color:var(--ink);font-size:14px}
.pal-in input::placeholder{color:var(--ink-subtle)}
.pal-list{max-height:400px;overflow:auto;padding:4px}
.pal-sec{padding:8px 10px 4px;font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-subtle)}
.pal-it{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;color:var(--ink);cursor:pointer}
.pal-it .s{color:var(--ink-subtle);font-size:12px;margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-it .k{margin-left:auto;display:flex;gap:3px;flex:none}
.pal-it.on{background:var(--s4);box-shadow:inset 2px 0 0 var(--brand-hover)}
.pal-it.dis{color:var(--ink-subtle);cursor:not-allowed}
.pal-it .g{width:14px;text-align:center;color:var(--ink-subtle);font-size:11px;flex:none}
.pal-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line1);font-size:11px;color:var(--ink-subtle)}
.pal-foot span{display:flex;gap:4px;align-items:center}
.pal-empty{padding:18px;text-align:center;color:var(--ink-muted)}

/* queue page */
.tools{display:flex;align-items:center;gap:8px}
.qt{--cols:80px minmax(0,1fr) 112px 150px 150px 92px 92px 236px}
.qt .colhead,.qt .tr{display:grid;grid-template-columns:var(--cols);gap:12px;align-items:center;padding:0 16px 0 18px}
.qt .colhead{height:32px;font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-subtle);border-bottom:1px solid var(--line1)}
.qt .colhead .r,.qt .tr .act{justify-self:end}
.grp>summary{list-style:none;display:flex;align-items:center;gap:8px;height:32px;padding:0 16px;background:var(--s2);border-top:1px solid var(--line1);font-weight:500;cursor:pointer}
.grp:first-of-type>summary{border-top:0}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .chev{color:var(--ink-subtle);transition:transform .12s;display:flex}
.grp:not([open])>summary .chev{transform:rotate(-90deg)}
.grp>summary .g{color:var(--ink-subtle);font-size:11px;width:12px;text-align:center}
.grp>summary .hint{margin-left:auto;display:flex;gap:4px;align-items:center;color:var(--ink-subtle);font-size:11.5px;font-weight:400}
.tr{position:relative;min-height:40px;border-top:1px solid var(--line1)}
.grp>summary+.tr{border-top:0}
.tr:hover{background:var(--s2)}
.tr .bar{position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--attn)}
.tr .cell2{color:var(--ink-subtle);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .cell2.ink{color:var(--ink-muted)}
.tr .st{display:flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500;color:var(--ink);font-size:12.5px}
.tr .st .g{color:var(--ink-subtle);font-size:10.5px;width:12px;text-align:center}
.tr .st small{color:var(--ink-subtle);font-weight:400;font-size:12px}
.tr .act{display:flex;gap:6px;align-items:center}

/* decisions page */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line1);margin-bottom:8px}
.tabs .tab{height:34px;padding:0 10px;display:flex;align-items:center;gap:6px;color:var(--ink-subtle);font-weight:500;border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
.tabs .tab:hover{color:var(--ink-muted)}
.tabs .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand-hover)}
.tabs .tab .n{font-size:11px;color:var(--ink-subtle)}
.dc{position:relative;display:grid;grid-template-columns:112px minmax(0,1fr) 120px;gap:16px;padding:14px 16px 14px 20px;border-top:1px solid var(--line1)}
.dc:first-of-type{border-top:0}
.dc .bar{position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--attn)}
.q1{display:flex;align-items:baseline;gap:8px;min-width:0}
.q1 .ttl{font-size:14px}
.meta2{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--ink-subtle);font-size:12px;margin-top:5px}
.meta2 .mono{color:var(--ink-muted);font-size:11.5px}
.dc .reqtext{margin-top:8px;max-width:640px}
.side{text-align:right;color:var(--ink-subtle);font-size:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.side b{display:block;color:var(--ink-muted);font-weight:500;font-size:13px}
.drow{display:grid;grid-template-columns:96px minmax(0,1fr) 160px 140px;gap:14px;padding:10px 16px;border-top:1px solid var(--line1);align-items:center}
.drow:first-of-type{border-top:0}
.drow .who{color:var(--ink-subtle);font-size:12px}
.choice{display:inline-flex;gap:5px;align-items:center;font-weight:500;font-size:12.5px}
.choice .g{color:var(--success)}
.choice.no .g{color:var(--ink-subtle)}

/* services / health */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.sv-h,.sv{display:grid;grid-template-columns:110px 130px 80px minmax(0,1fr) 120px 230px;gap:12px;align-items:center;padding:0 16px}
.sv-h{height:32px;color:var(--ink-subtle);font-size:11px;font-weight:500;letter-spacing:.3px;border-bottom:1px solid var(--line1);text-transform:uppercase}
.sv{min-height:44px;padding-top:8px;padding-bottom:8px;border-top:1px solid var(--line1);position:relative}
.sv-h + .sv{border-top:0}
.sv:hover{background:var(--s2)}
.sv .nm{font-family:var(--mono);font-size:12px;color:var(--ink)}
.sv .cad{color:var(--ink-muted);font-size:12px}
.sv .ok{color:var(--ink);display:inline-flex;gap:5px;align-items:center;font-weight:500}
.sv .ok i{font-style:normal;color:var(--success)}
.sv .bad{color:var(--ink);display:inline-flex;gap:5px;align-items:center;font-weight:500}
.sv .bad i{font-style:normal;color:var(--error)}
.sv .last{color:var(--ink-muted);font-size:12px;min-width:0}
.sv .nx{color:var(--ink-subtle);font-size:12px}
.sv .ac{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.sv.failed .bar{position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--error)}
.p6{grid-column:4 / -1;display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:2px}
.svfoot{padding:9px 16px;border-top:1px solid var(--line1);color:var(--ink-subtle);font-size:12px;display:flex;justify-content:space-between}
.hs{padding:12px 16px;border-top:1px solid var(--line1)}
.hs:first-of-type{border-top:0}
.hs h3{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hs h3 .st{margin-left:auto;font-size:12px;color:var(--ink-muted);font-weight:500;display:flex;gap:6px;align-items:center}
dl.kvd{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;font-size:12px}
dl.kvd dt{color:var(--ink-subtle)}
dl.kvd dd{color:var(--ink-muted)}
.pend{list-style:none;font-size:12px}
.pend li{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:3px 0}
.pend .ph{font-family:var(--mono);font-size:11px;color:var(--ink-muted)}
.pend .ids{font-family:var(--mono);font-size:11px;color:var(--ink-subtle);line-height:1.6}
.hs.stop{display:flex;align-items:center;gap:12px}
.hs.stop .t{flex:1;color:var(--ink-subtle);font-size:12px}
.cl{display:flex;gap:6px;align-items:center;color:var(--ink-subtle);font-size:12px;margin-top:6px}

/* caption + prototype controls */
.caption{position:fixed;right:12px;bottom:8px;font-size:11px;color:var(--ink-subtle);background:var(--canvas);
  border:1px solid var(--line1);border-radius:6px;padding:2px 8px;z-index:90}
.proto{position:fixed;left:12px;bottom:12px;z-index:95;width:268px;transition:width .12s;}
.proto.collapsed{width:200px}
.proto{background:#0b0b0d;border:1px dashed #4a4a52;border-radius:10px;font-size:12px;color:var(--ink-muted)}
.proto .ph2{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;width:100%;text-align:left;border-radius:10px}
.proto .ph2 b{font-weight:600;color:var(--ink);font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.proto .ph2 span{margin-left:auto;color:var(--ink-subtle);font-size:11px}
.proto .pb{padding:4px 10px 10px;border-top:1px dashed #33333a;display:flex;flex-direction:column;gap:8px}
.proto.collapsed .pb{display:none}
.proto .lbl{font-size:10.5px;color:var(--ink-subtle);letter-spacing:.3px;text-transform:uppercase;margin-top:4px}
.proto .states{display:flex;flex-wrap:wrap;gap:4px}
.proto .states button{height:22px;padding:0 7px;border:1px solid var(--line2);border-radius:5px;font-size:11px;color:var(--ink-muted);background:var(--s2)}
.proto .states button[aria-pressed="true"]{border-color:var(--brand-hover);color:var(--ink);background:var(--soft)}
.proto label{display:flex;gap:8px;align-items:center;cursor:pointer}
.proto input[type=checkbox]{accent-color:#828fff;width:13px;height:13px}
.proto .reset{align-self:flex-start}
</style>

<div id="app"></div>
<div id="layer" class="overlay-layer"></div>
<div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>

  <button class="ph2" id="protoToggle" aria-expanded="false"><b>Prototype controls</b><span>show</span></button>
  <div class="pb">
    <div class="lbl">Shared state (§4.1)</div>
    <div class="states" id="connStates"></div>
    <div class="lbl">Simulate</div>
    <label><input type="checkbox" autocomplete="off" id="optRm"> Reduce motion (pulse → outline + “new”)</label>
    <label><input type="checkbox" autocomplete="off" id="optLarge"> Large fixture (12 need you, 30 items)</label>
    <label><input type="checkbox" autocomplete="off" id="optWarp"> Warp not installed (SND-LAUNCH-002)</label>

    <button class="btn sm reset" id="optReset">Reset fixture</button>
  </div>
</aside>
<div class="caption">Prototype · design reference, not implementation</div>

  if(S.conn==='connecting') return '<span class="health"><span class="ok" style="color:var(--ink-muted)">Connecting…</span></span>';

function launchBlock(item, primary){
  const L = S.launch[item] || {};
  let h = '<section><div class="sec-h"><h3 class="eyebrow">Work on it</h3><span class="r">'+I.warp+' Warp</span></div>';
  if(S.warpMissing){
    h += '<div class="notice fail"><span class="ic" aria-hidden="true">'+I.xc+'</span><div class="t"><b>Warp isn\'t installed</b><span class="codechip">SND-LAUNCH-002</span>'+
      '<div class="detail">no app with bundle id dev.warp.Warp-Stable</div><div class="fixrow"><a href="https://www.warp.dev" target="_blank" rel="noopener">Install Warp</a><span class="lbl">or copy the CLI instead:</span></div>'+
      '<div class="fixrow" style="margin-top:6px">'+cmdCopy(seedCmd(item),'seedsheet:'+item,'wrap')+'</div></div></div></section>';
    return h;
  }
  if(L.phase==='sent'){
    const mins = Math.max(0, Math.floor((Date.now()-L.at)/60000));
    h += '<div class="notice"><span class="ic ok">'+I.okc+'</span><div class="t"><b>Sent to Warp</b> '+(mins?mins+'m ago':'just now')+' · '+esc(targetLabel(L.target))+' · tab <code>sindri '+esc(item)+'</code>'+
      '<p>'+esc(REPOPATH[repoOf(item)])+' · '+esc(L.clock)+'. Sindri can’t see inside Warp, so it doesn’t say the session is running.</p></div></div>'+
      '<div class="lb-row" style="margin-top:10px"><button class="btn" data-act="open-another" data-item="'+esc(item)+'" data-ctl="another:'+esc(item)+'">'+I.warp+'Open another session…</button>'+
      (S.items[item]&&S.items[item].group==='withyou'?'<span class="engine">with the engine</span><span class="help" style="margin:0">Taken over: the item is With you until you hand back.</span>':'')+'</div></section>';
    return h;
  }
  h += '<div class="lb-row">'+launchSplit(item,{primary:primary!==false, kbd:true})+'<span class="help" style="margin:0">'+esc(chosenWhy(item))+'</span></div>'+
    '<p class="lb-foot">Opens a new Warp tab in <code>'+esc(REPOPATH[repoOf(item)])+'</code> seeded with <code>'+esc(item)+'</code> only. Opening takes the item over: automation pauses until you hand back.</p></section>';
  return h;
}

  const ctl='ans:'+key; if(S.phase[ctl]) return;
  const t = $('#ans'); const val = t ? t.value.trim() : '';
  if(!val){ announce('Write an answer first'); t && t.focus(); return; }
  markSeen(key);
  S.answer[key]=val; S.phase[ctl]={sending:true}; render();
  setTimeout(()=>announce('Sending…'),300);
  setTimeout(()=>{
    S.phase[ctl]={accepted:'Answer recorded · re-running produce (round 2/3)'}; announce('Answer recorded · re-running produce (round 2/3)');
    S.cleared[key]='Answer recorded'; render();
    setTimeout(()=>{
      delete S.phase[ctl];
      const it = S.items[n.item];
      clearNeeds(key, 'answer recorded · re-running produce (round 2/3)', ()=>{ if(it){ it.group='running'; it.step='workflow.step › produce'; it.round='round 2/3'; it.where='Claude Code in Warp'; it.agent='Claude Code'; it.since=nowClock()+' (0m)'; moveRunningFront(n.item); } });
    }, 2000);
  }, 600);
}
function moveRunningFront(id){ S.order = S.order.filter(x=>x!==id); const i = S.order.findIndex(x=>S.items[x]&&S.items[x].group==='running'); S.order.splice(i<0?S.order.length:i,0,id); }
function openSheet(kind, id){
  S.sheet = {kind, id};
  let label = id;
  if(kind==='park'||kind==='gate'){ const n=needsByKey(id); label = n ? n.item : id; }
  if(kind==='profile') label='profile'; if(kind==='service') label='service '+id;
  S.lastSheet = {kind, id, label};
  S.menu=null; render();
}
function closeSheet(){
  if(!S.sheet) return;
  const s = S.sheet; S.sheet=null;
  // return focus to the row
  const sel = rowSelForSheet(s);
  S.pendingFocus = sel; render();
}
function rowSelForSheet(s){
  const map = {park:'ny:'+s.id, gate:'ny:'+s.id, profile:'ny:PRO', service: S.route==='services'?'sv:'+s.id:'ny:IDX', item:(S.route==='queue'?'q:':'it:')+s.id, decision: S.route==='decisions'?'dec:'+s.id:null};
  let k = map[s.kind];
  if(s.kind==='decision' && !k){ const d=S.decisions.find(x=>x.id===s.id); k = d&&d.needsKey ? 'ny:'+d.needsKey : null; }
  return k && document.querySelector('[data-row="'+CSS.escape(k)+'"]') ? '[data-row="'+CSS.escape(k)+'"]' : null;
}

/* subject of keyboard actions: the open sheet if focus is inside it, else the focused row */
function subject(){
  const a = document.activeElement;
  if(a && a.closest && a.closest('.sheet') && S.sheet) return {sheet:S.sheet};
  const row = (a && a.closest) ? a.closest('[data-row]') : null;
  const key = row ? row.dataset.row : S.focusKey;
  if(!key) return S.sheet ? {sheet:S.sheet} : null;
  return {row:key};
}
function resolve(sub){
  if(!sub) return null;
  if(sub.sheet){
    const s = sub.sheet;
    if(s.kind==='park'||s.kind==='gate'){ const n=needsByKey(s.id); return n?{needs:n}:null; }
    if(s.kind==='decision') return {dec:S.decisions.find(d=>d.id===s.id), inSheet:true};
    if(s.kind==='service') return {service:s.id};
    if(s.kind==='profile') return {needs:needsByKey('PRO')};
    if(s.kind==='item') return {item:S.items[s.id]};
  }
  const [p, id] = [sub.row.split(':')[0], sub.row.slice(sub.row.indexOf(':')+1)];
  if(p==='ny'){ const n=needsByKey(id); if(!n) return null; if(n.kind==='decision') return {needs:n, dec:S.decisions.find(d=>d.id===n.dec), inSheet: !!(S.sheet&&S.sheet.kind==='decision'&&S.sheet.id===n.dec)}; return {needs:n}; }
  if(p==='it'||p==='q'){ const it=S.items[id]; const n=S.needs.find(x=>x.item===id); return n && p==='q' && (it.group==='waiting'||it.group==='parked') ? (n.kind==='decision'?{needs:n,dec:S.decisions.find(d=>d.id===n.dec)}:{needs:n}) : {item:it}; }
  if(p==='dec') return {dec:S.decisions.find(d=>d.id===id), inSheet: !!(S.sheet&&S.sheet.kind==='decision'&&S.sheet.id===id)};
  if(p==='sv') return {service:id};
  return null;
}
function sheetFor(r){
  if(r.needs){ const n=r.needs; return n.kind==='decision'?['decision',n.dec]:n.kind==='failure'?['service','index']:n.kind==='profile'?['profile','PRO']:n.kind==='escalated'?['gate',n.key]:['park',n.key]; }
  if(r.dec) return ['decision', r.dec.id];
  if(r.item) return ['item', r.item.id];
  if(r.service) return ['service', r.service];
}
/* the actions for a subject — used by the palette and the keys */
function actionsFor(r){
  if(!r) return [];
  const A = []; const add=(label,key,run,o)=>A.push(Object.assign({label,key,run},o||{}));
  const n = r.needs, it = r.item, d = r.dec;
  const launchable = (id)=>{ if(S.warpMissing){ add('Copy: '+seedCmd(id).slice(0,48)+'…','',()=>copyText(seedCmd(id),'seed:'+id),{sub:'Warp isn’t installed'}); return; } add('Open in '+targetLabel(targetFor(id)),'O',()=>startLaunch(id),{sub:id}); TARGETS.forEach((t,i)=>{ if(t.id!==targetFor(id)) add('Open in '+t.label, '⇧O '+(i+1), ()=>startLaunch(id,t.id), {sub:id, disabled: t.id==='codex'&&S.codexMissing, why: t.id==='codex'&&S.codexMissing?'SND-LAUNCH-003':(t.limited?'limited':'')}); }); };
  if(n && n.kind==='park'){ add('Copy: '+n.cli,'Y',()=>copyText(n.cli,'rowcli:'+n.key),{sub:'protected'}); if(n.reasonKind==='no-progress') add('Answer with text…','',()=>{ openSheet('park',n.key); setTimeout(()=>{ const t=$('#ans'); t&&t.focus(); },0); }); launchable(n.item); add('Take over','T',()=>doTakeover(n.item)); add('Cancel instance','⇧X',()=>askCancel(n.key,'cancel:'+n.key),{destructive:true}); }
  if(n && n.kind==='escalated'){ add('Copy: '+n.cli,'Y',()=>copyText(n.cli,'rowcli:'+n.key),{sub:'protected'}); add('Reject','X',()=>askReject(n.key,'reject:'+n.key),{destructive:true}); launchable(n.item); }
  if(d && d.state==='pending'){ add('Accept '+d.id,'A',()=>doDecide(d.id,'Accept'),{sub:'recommended'}); add('Decline '+d.id,'X',()=>doDecide(d.id,'Decline')); launchable(d.item); }
  if(n && n.kind==='failure' || r.service){ const nm = r.service||'index'; add('Run again','',null,{disabled:true, why:'Available with API P6'}); add('Copy: sindri services run '+nm,'Y',()=>copyText('sindri services run '+nm,'svcli:'+nm)); }
  if(n && n.kind==='profile'){ add('Copy: '+n.cli,'Y',()=>copyText(n.cli,'rowcli:PRO'),{sub:'protected'}); }
  if(it){
    if(it.group==='withyou'){ add('Hand back '+it.id,'B',()=>doHandback(it.id)); add('Attach (with the engine)','',()=>doAttach(it.id)); }
    if(it.group==='running'){ launchable(it.id); add('Take over '+it.id,'T',()=>doTakeover(it.id)); }
    if(it.group==='queued'){ launchable(it.id); }
  }
  const sh = sheetFor(r); if(sh) add('Open details','↵',()=>openSheet(sh[0],sh[1]));
  return A;
}

/* ───────────────────────── palette ───────────────────────── */
let PAL = {q:'', sel:0, items:[], ctx:null};
function openPalette(){
  if(['notrunning','mismatch','connecting'].includes(S.conn)) return;
  S.menu=null; renderLayer();
  PAL.ctx = resolve(subject()); PAL.return = document.activeElement;
  S.palette = true;
  const el = document.createElement('div'); el.className='scrim'; el.id='palScrim'; el.style.background='rgba(0,0,0,.35)'; el.style.paddingTop='0';
  el.innerHTML = '<div class="pal" role="dialog" aria-modal="true" aria-label="Command palette"><div class="pal-in">'+I.search+'<input id="palIn" placeholder="Search actions, pages, items by id or title" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palList"><kbd>Esc</kbd></div><div class="pal-list" id="palList" role="listbox"></div>'+
    '<div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> Move</span><span><kbd>↵</kbd> Run</span><span><kbd>Esc</kbd> Close</span><span style="margin-left:auto">Fuzzy match on labels and ids</span></div></div>';
  document.body.appendChild(el);
  el.addEventListener('mousedown', e=>{ if(e.target===el) closePalette(); });
  const inp = $('#palIn'); inp.addEventListener('input', ()=>{ PAL.q=inp.value; PAL.sel=0; palList(); });
  PAL.q=''; PAL.sel=0; palList(); inp.focus();
}
function closePalette(){ const el=$('#palScrim'); if(el) el.remove(); S.palette=false; if(PAL.return && document.contains(PAL.return)) PAL.return.focus({preventScroll:true}); }
function fuzzy(q, s){ q=q.toLowerCase(); s=s.toLowerCase(); if(!q) return 1; if(s.includes(q)) return 100 - s.indexOf(q); let i=0, score=0, last=-1; for(const c of s){ if(c===q[i]){ score += (last===-1||i===0)?2:1; last=i; i++; if(i===q.length) return score; } } return 0; }
function palEntries(){
  const E = [];
  const ctxName = PAL.ctx ? (PAL.ctx.needs ? (PAL.ctx.needs.item||PAL.ctx.needs.idText||'profile') : PAL.ctx.dec ? PAL.ctx.dec.id : PAL.ctx.item ? PAL.ctx.item.id : PAL.ctx.service ? 'service '+PAL.ctx.service : '') : '';
  actionsFor(PAL.ctx).forEach(a=>E.push({sec:'Actions'+(ctxName?' · '+ctxName:''), g:'›', label:a.label, sub:a.why||a.sub||'', key:a.key, run:a.run, disabled:a.disabled}));
  [['Home','G H','home'],['Needs you','G N','needs'],['Queue','G Q','queue'],['Decisions','G D','decisions'],['Services','G S','services'],['Health','G .','health']].forEach(p=>E.push({sec:'Go to', g:'→', label:'Go to '+p[0], key:p[1], run:()=>p[2]==='needs'?goNeeds():go(p[2])}));
  S.order.forEach(id=>{ const it=S.items[id]; if(!it||it.group==='closed') return; const k = it.group==='waiting'||it.group==='parked' ? S.needs.find(x=>x.item===id) : null;
    E.push({sec:'Items', g:GLYPH[{withyou:'withyou',running:'running',queued:'queued',parked:'park',waiting:'decision'}[it.group]]||'○', label:id+'  '+it.title, sub:it.group==='withyou'?'with you':it.group, run:()=>{ if(k) openSheet(k.kind==='decision'?'decision':k.kind==='escalated'?'gate':'park', k.kind==='decision'?k.dec:k.key); else openSheet('item',id); }}); });
  S.decisions.filter(d=>d.state==='pending').forEach(d=>E.push({sec:'Items', g:'?', label:d.id+'  '+d.question, sub:'decision', run:()=>openSheet('decision',d.id)}));
  E.push({sec:'Sindri', g:'⟳', label:'Rebuild views', key:'', run:()=>rebuild()});
  E.push({sec:'Sindri', g:'◇', label:'Mark all seen', key:'⇧A', run:()=>markAll()});
  E.push({sec:'Sindri', g:'?', label:'Keyboard shortcuts', key:'?', run:()=>openKeys()});
  E.push({sec:'Sindri', g:'✕', label:'Stop Sindri…', key:'', run:()=>{ go('health'); setTimeout(()=>openStop(),0); }});
  return E;
}
function palList(){
  const q = PAL.q.trim();
  let E = palEntries().map(e=>Object.assign(e,{score:fuzzy(q, e.label+' '+(e.sub||''))})).filter(e=>e.score>0);
  if(q) E.sort((a,b)=>b.score-a.score);
  PAL.items = E;
  if(PAL.sel>=E.length) PAL.sel = Math.max(0,E.length-1);
  while(E[PAL.sel] && E[PAL.sel].disabled && PAL.sel<E.length-1) PAL.sel++;
  const L = $('#palList'); L.innerHTML='';
  if(!E.length){ const d=document.createElement('div'); d.className='pal-empty'; d.textContent='No match for “'+q+'”'; L.appendChild(d); return; }
  let sec=null;
  E.forEach((e,i)=>{
    const secName = q ? (i===0?'Best matches':null) : e.sec;
    if(secName && secName!==sec){ const h=document.createElement('div'); h.className='pal-sec'; h.textContent=secName; L.appendChild(h); sec=secName; }
    const it=document.createElement('div'); it.className='pal-it'+(i===PAL.sel?' on':'')+(e.disabled?' dis':''); it.setAttribute('role','option'); it.setAttribute('aria-selected', i===PAL.sel); it.setAttribute('aria-disabled', !!e.disabled);
    const g=document.createElement('span'); g.className='g'; g.textContent=e.g; it.appendChild(g);
    const l=document.createElement('span'); l.textContent=e.label; l.style.whiteSpace='nowrap'; l.style.overflow='hidden'; l.style.textOverflow='ellipsis'; it.appendChild(l);
    if(e.sub){ const s=document.createElement('span'); s.className='s'; s.textContent=e.sub; it.appendChild(s); }
    const k=document.createElement('span'); k.className='k'; (e.key||'').split(' ').filter(Boolean).forEach(x=>{ const kb=document.createElement('kbd'); kb.textContent=x; k.appendChild(kb); }); it.appendChild(k);
    it.addEventListener('mousemove', ()=>{ if(PAL.sel!==i){ PAL.sel=i; $$('.pal-it').forEach((x,j)=>x.classList.toggle('on',j===i)); } });
    it.addEventListener('click', ()=>runPal(i));
    L.appendChild(it);
  });
  const on = $('.pal-it.on'); on && on.scrollIntoView({block:'nearest'});
}
function runPal(i){ const e = PAL.items[i]; if(!e || e.disabled || !e.run) { if(e&&e.disabled) announce(e.label+': '+(e.sub||'not available')); return; } PAL.return=null; closePalette(); e.run(); }

/* ───────────────────────── misc actions ───────────────────────── */
function markAll(){ S.needs.forEach(n=>{ if(n.urgency==='pulse') S.seen.add(n.key); }); announce('All marked seen'); render(); }
function goNeeds(){ S.nyExpanded = S.needs.length>5; if(S.route!=='home') location.hash='home'; S.route='home'; render(); const f=$('[data-row^="ny:"]'); f && f.focus(); window.scrollTo(0,0); }
function rebuild(){
  if(S.conn!=='stalled' && S.conn!=='normal'){ return; }
  S.phase.rebuild={sending:true}; render();
  setTimeout(()=>{ delete S.phase.rebuild; S.conn='rebuilding'; S.rebuildPct=10; announce('Rebuilding views'); render();
    const iv = setInterval(()=>{ S.rebuildPct = Math.min(100, S.rebuildPct+18); render(); if(S.rebuildPct>=100){ clearInterval(iv); setTimeout(()=>{ S.conn='normal'; S.rebuildPct=28.5; announce('Views rebuilt'); render(); }, 300); } }, 300);
  }, 500);
}
function openStop(){ S.dialog='stop'; S.dialogReturn=document.activeElement; render(); setTimeout(()=>{ const b=$('#dlg-cancel'); b&&b.focus(); },0); }
function openKeys(){ S.dialog='keys'; S.dialogReturn=document.activeElement; render(); setTimeout(()=>{ const b=$('#keys-close'); b&&b.focus(); },0); }
function closeDialog(){ S.dialog=null; const r=S.dialogReturn; render(); if(r && document.contains(r)) r.focus(); }
function openTargetMenu(item, anchor){ S.menu = {item, anchor: anchor || 'chev:'+item}; S.checkPhase=null; render(); setTimeout(()=>{ const f = $('#tmenu .mi[aria-checked="true"]') || $('#tmenu .mi:not(.off)'); f && f.focus(); },0); }

/* clicks */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(!t){
    if(S.menu && !e.target.closest('.menu')){ S.menu=null; render(); }
    if(S.pop && !e.target.closest('.pop')){ S.pop=null; render(); }
    return;
  }
  const act = t.dataset.act;
  if(t.hasAttribute('disabled')) return;
  if(act!=='menu' && act!=='later' && act!=='pick' && act!=='check-again' && act!=='copy' && S.menu && !t.closest('.menu')){ S.menu=null; }
  switch(act){
    case 'go': e.preventDefault(); go(t.dataset.to); break;
    case 'sheet': { const row=t.closest('[data-row]'); if(row){ S.focusKey=row.dataset.row; } openSheet(t.dataset.kind, t.dataset.id); if(row) row.focus({preventScroll:true}); break; }
    case 'close-sheet': closeSheet(); break;
    case 'reopen': if(S.lastSheet) openSheet(S.lastSheet.kind, S.lastSheet.id); break;
    case 'copy': { const row=t.closest('[data-row]'); if(row && row.dataset.row.startsWith('ny:')) markSeen(row.dataset.row.slice(3)); copyText(t.dataset.cli, t.dataset.ctl); break; }
    case 'launch': { const row=t.closest('[data-row]'); if(row && row.dataset.row.startsWith('ny:')) markSeen(row.dataset.row.slice(3)); startLaunch(t.dataset.item); break; }
    case 'menu': if(S.menu && S.menu.item===t.dataset.item){ S.menu=null; render(); } else openTargetMenu(t.dataset.item, t.dataset.ctl); break;
    case 'pick': startLaunch(t.dataset.item, t.dataset.target); break;
    case 'check-again': S.checkPhase='checking'; renderLayer(); setTimeout(()=>{ S.checkPhase='done'; announce('Launch targets checked'); renderLayer(); }, 1000); break;
    case 'later': S.menu = S.menu&&S.menu.later ? null : {later:true}; render(); break;
    case 'decide': doDecide(t.dataset.dec, t.dataset.choice); break;
    case 'reject': askReject(t.dataset.key, t.dataset.ctl); break;
    case 'cancel-inst': askCancel(t.dataset.key, t.dataset.ctl); break;
    case 'pop-yes': popYes(); break;
    case 'pop-no': { const r=S.popReturn; S.pop=null; render(); const el=r&&document.querySelector('[data-ctl="'+CSS.escape(r)+'"]'); el&&el.focus(); break; }
    case 'answer': sendAnswer(t.dataset.key); break;
    case 'takeover': doTakeover(t.dataset.item); break;
    case 'handback': doHandback(t.dataset.item); break;
    case 'attach': doAttach(t.dataset.item); break;
    case 'open-another': S.pop = {kind:'another', item:t.dataset.item, anchor:t.dataset.ctl, title:'Open another session for '+t.dataset.item+'?', body:'A session was already sent to Warp (tab sindri '+t.dataset.item+'). Sindri can’t see whether it’s still running; a second one works beside it.', yes:'Open another', no:'Keep one'}; S.popReturn=t.dataset.ctl; render(); setTimeout(()=>{ const b=$('#pop-no'); b&&b.focus(); },0); break;
    case 'seen-all': markAll(); break;
    case 'ny-expand': S.nyExpanded=true; render(); break;
    case 'ny-collapse': S.nyExpanded=false; render(); break;
    case 'rebuild': rebuild(); break;
    case 'refresh': S.phase.refresh={sending:true}; render(); setTimeout(()=>{ delete S.phase.refresh; S.conn='normal'; S.staleFails=0; announce('Refreshed'); render(); }, 700); break;
    case 'stop': openStop(); break;
    case 'dialog-cancel': closeDialog(); break;
    case 'dialog-bg': if(e.target===t) closeDialog(); break;
    case 'dialog-stop': S.dialog=null; S.sheet=null; S.conn='notrunning'; announce('Sindri stopped'); render(); break;
    case 'tab': S.decTab=t.dataset.tab; render(); break;
    case 'palette': openPalette(); break;
    case 'pending': announce('Available with API P6'); break;
  }
});
/* "open another" confirm reuses the popover: intercept its yes */
const _popYes = popYes;
popYes = function(){ if(S.pop && S.pop.kind==='another'){ const item=S.pop.item; S.pop=null; delete S.launch[item]; startLaunch(item); return; } _popYes(); };

/* queue group collapse memory */
document.addEventListener('toggle', e=>{ const d=e.target; if(d.dataset && d.dataset.grp){ S.collapsed[d.dataset.grp] = !d.open; } }, true);

/* focus tracking → "seen" after 1 s */
document.addEventListener('focusin', e=>{
  const row = e.target.closest && e.target.closest('[data-row]');
  if(row){
    const k=row.dataset.row;
    if(S.focusKey!==k){ S.focusKey=k; S.focusSince=Date.now(); $$('[data-row].cur').forEach(r=>r.classList.remove('cur')); row.classList.add('cur'); }
  }
});
setInterval(()=>{
  if(!S.focusKey || !S.focusKey.startsWith('ny:')) return;
  const a = document.activeElement; const row = a && a.closest && a.closest('[data-row]');
  if(!row || row.dataset.row!==S.focusKey) return;
  const k = S.focusKey.slice(3); const n = needsByKey(k);
  if(n && n.urgency==='pulse' && !S.seen.has(k) && Date.now()-S.focusSince>=1000){ S.seen.add(k); render(); }
}, 200);

/* keyboard */
let chordT = null, chord = false;
function setChord(on){ chord=on; const c=$('#chord'); if(c) c.classList.toggle('on',on); clearTimeout(chordT); if(on) chordT=setTimeout(()=>setChord(false),1000); }
function isTyping(el){ return el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.isContentEditable); }
function moveRow(dir){
  const rows = $$('#app [data-row]').filter(r=>r.offsetParent!==null);
  if(!rows.length) return;
  const a = document.activeElement; const cur = a && a.closest ? a.closest('[data-row]') : null;
  let i = cur ? rows.indexOf(cur) : rows.findIndex(r=>r.dataset.row===S.focusKey);
  i = i<0 ? (dir>0?0:rows.length-1) : Math.max(0, Math.min(rows.length-1, i+dir));
  rows[i].focus(); rows[i].scrollIntoView({block:'nearest'});
}
document.addEventListener('keydown', e=>{
  const k = e.key;
  if((e.metaKey||e.ctrlKey) && k.toLowerCase()==='k'){ e.preventDefault(); if(S.palette) closePalette(); else openPalette(); return; }
  if(S.palette){
    if(k==='Escape'){ e.preventDefault(); closePalette(); }
    else if(k==='ArrowDown'){ e.preventDefault(); let i=PAL.sel; do{ i=Math.min(PAL.items.length-1,i+1); }while(PAL.items[i]&&PAL.items[i].disabled&&i<PAL.items.length-1); PAL.sel=i; palList(); }
    else if(k==='ArrowUp'){ e.preventDefault(); let i=PAL.sel; do{ i=Math.max(0,i-1); }while(PAL.items[i]&&PAL.items[i].disabled&&i>0); PAL.sel=i; palList(); }
    else if(k==='Enter'){ e.preventDefault(); runPal(PAL.sel); }
    return;
  }
  // ⌘↵ sends the answer form
  if(k==='Enter' && (e.metaKey||e.ctrlKey) && document.activeElement && document.activeElement.id==='ans' && S.sheet){ e.preventDefault(); sendAnswer(S.sheet.id); return; }
  if(k==='Escape'){
    if(S.dialog){ e.preventDefault(); closeDialog(); return; }
    if(S.pop){ e.preventDefault(); const r=S.popReturn; S.pop=null; render(); const el=r&&document.querySelector('[data-ctl="'+CSS.escape(r)+'"]'); el&&el.focus(); return; }
    if(S.menu){ e.preventDefault(); const anc=S.menu.anchor||'later'; S.menu=null; render(); const el=document.querySelector('[data-ctl="'+CSS.escape(anc)+'"]'); el&&el.focus(); return; }
    if(S.sheet){ e.preventDefault(); closeSheet(); return; }
    return;
  }
  if(isTyping(document.activeElement)) return;
  if(S.dialog){ return; }
  // menu: 1/2/3 pick, arrows move
  if(S.menu && S.menu.item){
    if(['1','2','3'].includes(k)){ e.preventDefault(); const t=TARGETS[+k-1]; if(!(t.id==='codex'&&S.codexMissing)) startLaunch(S.menu.item, t.id); else announce('Codex is not available: SND-LAUNCH-003'); return; }
    if(k==='ArrowDown'||k==='ArrowUp'){ e.preventDefault(); const its=$$('#tmenu button.mi'); const i=its.indexOf(document.activeElement); const n=its[(i+(k==='ArrowDown'?1:-1)+its.length)%its.length]; n&&n.focus(); return; }
  }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(['notrunning','mismatch'].includes(S.conn)) return;
  if(chord){
    const map = {n:'needs', h:'home', q:'queue', d:'decisions', s:'services', '.':'health', r:'queue', w:'queue'};
    const dest = map[k.toLowerCase()]; setChord(false);
    if(dest){ e.preventDefault(); if(dest==='needs') goNeeds(); else { go(dest); if(k==='r'||k==='w'){ setTimeout(()=>{ const g=$('[data-grp="'+(k==='r'?'running':'withyou')+'"] summary'); g&&g.scrollIntoView({block:'center'}); },50);} } }
    return;
  }
  const r = resolve(subject());
  const acts = actionsFor(r);
  const byKey = (key)=>acts.find(a=>a.key===key && !a.disabled);
  switch(true){
    case k==='g'||k==='G': if(!e.shiftKey){ e.preventDefault(); setChord(true); } break;
    case k==='j'||k==='ArrowDown': if(!e.target.closest('.menu')){ e.preventDefault(); moveRow(1); } break;
    case k==='k'||k==='ArrowUp': if(!e.target.closest('.menu')){ e.preventDefault(); moveRow(-1); } break;
    case k==='Enter': {
      const a=document.activeElement;
      if(a && a.dataset && a.dataset.row && r){ e.preventDefault(); const sh=sheetFor(r); if(sh){ if(S.sheet && S.sheet.kind===sh[0] && S.sheet.id===sh[1]){ const f=$('.sheet .btn:not([disabled]), .sheet textarea'); f&&f.focus(); } else openSheet(sh[0],sh[1]); } }
      break; }
    case k==='?': e.preventDefault(); openKeys(); break;
    case k==='A' && e.shiftKey: e.preventDefault(); markAll(); break;
    case k==='a': {
      e.preventDefault();
      if(!r) break;
      if(r.dec){ if(r.inSheet) doDecide(r.dec.id,'Accept'); else announce('Open the decision (Enter) to accept it with A'); break; }
      if(r.item && r.item.group==='withyou'){ doHandback(r.item.id); break; }
      if(r.needs && r.needs.kind==='failure' || r.service){ announce('Run again is available with API P6'); break; }
      if(r.needs && (r.needs.kind==='park'||r.needs.kind==='escalated'||r.needs.kind==='profile')){ announce('Protected: press Y to copy the command'); break; }
      announce('No single primary action here'); break; }
    case k==='O' && e.shiftKey: { e.preventDefault(); const id = r && (r.item?r.item.id:r.needs?r.needs.item:r.dec?r.dec.item:null); if(id && !S.warpMissing){ const chev = document.querySelector('[data-ctl="'+CSS.escape('chev:'+id)+'"]'); openTargetMenu(id, chev?'chev:'+id:null); } break; }
    case k==='o': { e.preventDefault(); const a=byKey('O'); if(a){ if(r.needs) markSeen(r.needs.key); a.run(); } else if(S.warpMissing) announce('Warp isn’t installed: press Y to copy the command'); break; }
    case k==='X' && e.shiftKey: { e.preventDefault(); const a=byKey('⇧X'); a&&a.run(); break; }
    case k==='x': { e.preventDefault(); const a=byKey('X'); a&&a.run(); break; }
    case k==='t': { e.preventDefault(); const a=acts.find(x=>x.key==='T'); a&&a.run(); break; }
    case k==='b': { e.preventDefault(); const a=byKey('B'); a&&a.run(); break; }
    case k==='y': { e.preventDefault(); const a=byKey('Y') || (r&&r.item&&S.warpMissing? {run:()=>copyText(seedCmd(r.item.id),'seed:'+r.item.id)}:null); if(a){ if(r.needs) markSeen(r.needs.key); a.run(); } else announce('This row has no command to copy'); break; }
  }
});
window.addEventListener('resize', ()=>{ if(S.menu||S.pop) renderLayer(); });
window.addEventListener('scroll', ()=>{ if(S.menu||S.pop) renderLayer(); }, {passive:true});

/* answer textarea + note memory (no re-render while typing) */
document.addEventListener('input', e=>{
  if(e.target.id==='ans' && S.sheet) S.answer[S.sheet.id]=e.target.value;
  if(e.target.classList && e.target.classList.contains('note-in')) S.note[e.target.id.slice(5)]=e.target.value;
});

/* ───────────────────────── prototype controls ───────────────────────── */
const CONNS = [['normal','Normal'],['notrunning','Not running'],['connecting','Connecting'],['mismatch','Version mismatch'],['rebuilding','Rebuilding'],['stalled','Stalled'],['stale','Stale']];
$('#connStates').innerHTML = CONNS.map(c=>'<button data-conn="'+c[0]+'" aria-pressed="false">'+c[1]+'</button>').join('');
$('#connStates').addEventListener('click', e=>{ const b=e.target.closest('[data-conn]'); if(!b) return; e.stopPropagation(); S.conn=b.dataset.conn; S.rebuildPct=28.5; S.staleFails=0; S.menu=null; S.pop=null; if(S.conn==='notrunning'||S.conn==='mismatch'||S.conn==='connecting') S.sheet=null; announce('State: '+b.textContent); render(); });
$('#optRm').addEventListener('change', e=>{ S.rm=e.target.checked; render(); });
$('#optLarge').addEventListener('change', e=>{ S.large=e.target.checked; loadFixture(); announce(S.needs.length+' now need you'); render(); });
$('#optWarp').addEventListener('change', e=>{ S.warpMissing=e.target.checked; S.menu=null; render(); });
$('#optCodex').addEventListener('change', e=>{ S.codexMissing=e.target.checked; render(); });
$('#optReset').addEventListener('click', e=>{ e.stopPropagation(); S.conn='normal'; S.warpMissing=false; S.codexMissing=false; S.decTab='pending'; S.lastSheet=null; S.collapsed={}; loadFixture(); announce('Fixture reset · '+S.needs.length+' now need you'); render(); });
$('#protoToggle').addEventListener('click', e=>{ e.stopPropagation(); const p=$('#proto'); const c=p.classList.toggle('collapsed'); e.currentTarget.setAttribute('aria-expanded', !c); e.currentTarget.querySelector('span').textContent = c ? 'show' : 'not part of the app · hide'; });
$('#proto').addEventListener('click', e=>e.stopPropagation());
$('#proto').addEventListener('keydown', e=>e.stopPropagation());
function syncProto(){
  $$('#connStates [data-conn]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.conn===S.conn));
  $('#optRm').checked=S.rm; $('#optLarge').checked=S.large; $('#optWarp').checked=S.warpMissing; $('#optCodex').checked=S.codexMissing;
}

/* boot */
S.route = (location.hash.slice(1)||'home'); if(!['home','queue','decisions','services','health'].includes(S.route)) S.route='home';
render();
setTimeout(()=>announce(S.needs.length+' now need you'), 400);
setInterval(()=>{ if(Object.values(S.launch).some(l=>l.phase==='sent') && !S.palette && !isTyping(document.activeElement)) render(); }, 30000);
</script>
