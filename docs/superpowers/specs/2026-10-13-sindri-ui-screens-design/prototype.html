<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sindri</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--canvas:#010102; --s1:#0f1011; --s2:#141516; --s3:#18191a; --s4:#191a1b; --line1:#23252a; --line2:#34343a; --line3:#3e3e44; --ink:#f7f8f8; --ink-muted:#d0d6e0; --ink-subtle:#8a8f98; --ink-tertiary:#62666d; --on-primary:#fbfbfd; --brand:#5e6ad2; --brand-hover:#828fff; --focus:#828fff; --brand-hover-fill:#535fc6; --brand-pressed:#4c57be; --brand-deep:#535db9; --error:#eb5757; --success:#27a644; --attn:#f2994a; --attn-soft:rgba(242,153,74,.14); --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.4; -webkit-font-smoothing:antialiased;font-feature-settings:"cv01","ss03"}
button,input,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
a{color:var(--brand-hover);text-decoration:none}
:focus-visible,.is-focused{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.1px}
kbd{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--ink-subtle);line-height:1.2; border:1px solid var(--line2);border-radius:4px;padding:2px 6px;min-width:18px; display:inline-flex;align-items:center;justify-content:center;background:var(--s2)}
small{font-size:11px}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.g-done{color:var(--ink-muted)}
.g-live{color:var(--success)}
.g-prog{color:var(--ink)}
.g-todo{color:var(--ink-subtle)}
.g-you{color:var(--ink-muted)}
.g-park,.g-esc,.g-chg{color:var(--attn)}
.g-model{color:var(--ink-subtle)}
.g-loop{color:var(--ink-subtle)}
.g-cur{color:var(--ink)}
.h-ok{color:var(--success)}
.h-deg{color:var(--ink)}
.h-fail{color:var(--error)}
.h-abs{color:var(--ink-subtle)}
.lg{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-subtle)}
.lg-row{display:flex;flex-wrap:wrap;gap:4px 14px;white-space:nowrap}
.lg-row span{display:inline-flex;align-items:center;gap:5px}
.lg-row .g{width:auto}
.topbar{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px; border-bottom:1px solid var(--line1);background:var(--canvas);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;letter-spacing:-.2px;flex:none}
.brand-mark{width:20px;height:20px;border-radius:5px;background:var(--brand);color:var(--on-primary);display:grid;place-items:center}
.seg{display:flex;align-items:center;gap:2px;padding:2px;background:var(--s1);border:1px solid var(--line1);border-radius:8px;flex:none}
.seg a{display:flex;align-items:center;gap:6px;height:26px;padding:2px 8px;border-radius:6px; color:var(--ink-subtle);font-weight:500;font-size:13px;white-space:nowrap}
.seg a:hover{color:var(--ink-muted);background:var(--s2)}
.seg a[aria-current="page"]{color:var(--ink);background:var(--s3);box-shadow:inset 0 0 0 1px var(--line2)}
.seg a[aria-current="page"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}
.count-attn{font-size:11px;font-weight:600;line-height:1.2;color:var(--attn);background:var(--attn-soft); border-radius:4px;padding:2px 6px;display:inline-flex;align-items:center}
.count{font-size:11px;font-weight:500;color:var(--ink-subtle)}
.search{margin-left:auto;display:flex;align-items:center;gap:6px;flex:1 1 160px;min-width:120px;max-width:260px;white-space:nowrap;height:30px;padding:4px 8px 4px 10px; border:1px solid var(--line1);border-radius:8px;background:var(--s1);color:var(--ink-subtle)}
.search span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.search kbd{flex:none}
.health{display:flex;align-items:center;gap:6px;height:30px;padding:4px 10px;border:1px solid var(--line1);flex:none; border-radius:8px;background:var(--s1);white-space:nowrap;font-size:12px;color:var(--ink-muted)}
.health .word{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-weight:500;font-size:13px}
.health .sep{color:var(--ink-subtle)}
.health .age{color:var(--ink-subtle)}
.attn-band{height:2px;background:var(--attn)}
.page{max-width:1264px;margin:0 auto;padding:0 40px 48px 16px}
.pagehead h1{font-size:20px;font-weight:600;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.pagehead h1 .crumb{color:var(--ink-subtle);font-weight:500}
.pagehead .sub{color:var(--ink-subtle);margin-top:2px;display:flex;gap:8px;align-items:center}
.pagehead .sub b{color:var(--ink-muted);font-weight:500}
.attn-word{color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.attn-word i{width:6px;height:6px;border-radius:50%;background:var(--attn)}
.hints{display:flex;gap:12px;color:var(--ink-subtle);font-size:12px;white-space:nowrap}
.hints span{display:flex;align-items:center;gap:4px}
.panel{background:var(--s1);border:1px solid var(--line1);border-radius:12px;box-shadow:inset 0 1px 0 rgba(247,248,248,.035)}
.phead{display:flex;align-items:center;gap:8px;height:36px;padding:4px 16px;border-bottom:1px solid var(--line1)}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-muted)}
.phead .meta{margin-left:auto;color:var(--ink-subtle);font-size:12px;display:flex;gap:10px;align-items:center}
.phead .meta a{color:var(--brand-hover)}
.row2{display:grid;grid-template-columns:1.5fr 1fr;gap:8px;margin-top:8px}
.ny:first-of-type{border-top:0}
.ny:hover{background:var(--s2)}
.ny.sel{background:var(--s3)}
.ny.pulse,.ny.colour{background:var(--attn-soft)}
.ny.pulse .chip{color:var(--attn)}
.kind{display:flex;flex-direction:column;gap:3px}
.chip{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;padding:2px 6px;line-height:1.2; border-radius:4px;border:1px solid var(--line2);background:var(--s2);font-size:11px;font-weight:500;color:var(--ink)}
.motion{font-size:11px;color:var(--ink-subtle);white-space:nowrap}
.newword{display:none;font-size:11px;font-weight:600;color:var(--attn)}
.what{min-width:0}
.what .line1{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
.what .line1>*{flex:none}
.what .line1 .title{flex:0 1 auto;min-width:0}
.what .line1 .rest{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--ink-subtle)}
.id{color:var(--ink-subtle);white-space:nowrap}
.what .title{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.what .line2{color:var(--ink-subtle);margin-top:2px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.what .line2 .reason{color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;line-height:1.2;border:1px solid var(--line2);border-radius:6px;padding:2px 6px;color:var(--ink-subtle);display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.since{color:var(--ink-subtle);font-size:11px;text-align:right;line-height:1.4;white-space:nowrap}
.since b{display:block;color:var(--ink-muted);font-weight:500;font-size:12px}
.acts{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.btn{height:28px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px; border:1px solid var(--line2);background:var(--s3);color:var(--ink-muted);white-space:nowrap}
.btn:hover{background:var(--s4);border-color:var(--line3);color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-primary)}
.btn.primary:hover{background:var(--brand-hover-fill);border-color:var(--brand-hover-fill)}
.btn.primary:active{background:var(--brand-pressed);border-color:var(--brand-pressed)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-subtle)}
.btn.ghost:hover{color:var(--ink-muted);background:var(--s2)}
.btn[disabled]{color:var(--ink-tertiary);background:var(--s2);border-color:var(--line1);cursor:not-allowed}
.btn kbd{margin-left:1px}
.btn.primary kbd{color:var(--on-primary);opacity:.85;border-color:transparent;background:var(--brand-deep)}
.btn.term{background:var(--s2);color:var(--ink)}
.btn.term svg{color:var(--ink-subtle)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.split{position:relative;display:inline-flex}
.split .main{border-radius:8px 0 0 8px}
.split .chev{border-radius:0 8px 8px 0;border-left-color:var(--line1);padding:0 6px;margin-left:-1px}
.warp{width:12px;height:12px;border-radius:3px;background:var(--s4);border:1px solid var(--line3);display:inline-grid;place-items:center}
.cmd .prompt{font-family:var(--mono);font-size:11px;color:var(--ink-subtle);padding:4px 0 4px 8px;display:flex;align-items:center}
.cmd code{font-family:var(--mono);font-size:12px;color:var(--ink-muted);padding:4px 8px 4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
.cmd button{padding:4px 8px;border-left:1px solid var(--line1);color:var(--ink-subtle);display:flex;align-items:center;gap:4px;font-size:12px}
.cmd button:hover{color:var(--ink);background:var(--s3)}
.pending{font-size:11px;line-height:1.2;color:var(--ink-subtle);border:1px dashed var(--line2);border-radius:4px;padding:2px 6px;white-space:nowrap}
.run{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;padding:5px 16px;border-top:1px solid var(--line1);align-items:center}
.run:first-of-type{border-top:0}
.run:hover{background:var(--s2)}
.run .step{display:flex;gap:6px;align-items:center;color:var(--ink-subtle);margin-top:2px;white-space:nowrap;overflow:hidden;font-size:12px}
.run .step .mono{color:var(--ink-muted)}
.state{display:inline-flex;align-items:center;gap:5px;font-weight:500;color:var(--ink);font-size:12px;white-space:nowrap}
.budget{grid-column:1/-1;display:flex;align-items:center;gap:10px;color:var(--ink-subtle);font-size:12px}
.budget .track{flex:1;height:3px;border-radius:2px;background:var(--line1);overflow:hidden}
.budget .fill{height:100%;background:var(--ink-subtle)}
.subgroup{display:flex;align-items:center;gap:8px;padding:6px 16px 4px;font-size:12px;color:var(--ink-subtle);border-top:1px solid var(--line1)}
.subgroup:first-of-type{border-top:0}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding:5px 16px;border-top:1px solid var(--line1);align-items:center}
.q:first-of-type{border-top:0}
.q:hover{background:var(--s2)}
.q .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .t b{font-weight:500}
.q .sub{color:var(--ink-subtle);font-size:12px}
.q .r{color:var(--ink-subtle);font-size:12px;text-align:right;white-space:nowrap}
.qfoot{padding:8px 16px;border-top:1px solid var(--line1);color:var(--ink-subtle);font-size:12px;display:flex;justify-content:space-between}
.strip{display:flex;align-items:stretch;margin-top:8px;background:var(--s1);border:1px solid var(--line1);border-radius:12px;overflow:hidden}
.strip .hd{display:flex;align-items:center;gap:8px;padding:0 14px;border-right:1px solid var(--line1);white-space:nowrap}
.cell{flex:1 1 auto;padding:6px 12px;border-right:1px solid var(--line1);min-width:0}
.cell:last-child{border-right:0}
.cell .k{font-size:11px;color:var(--ink-subtle);display:block}
.cell .v{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;font-size:12px}
.cell .v .mono{font-weight:400;color:var(--ink-muted)}
.cell .v.warn{color:var(--ink-muted)}
.sheet-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);writing-mode:vertical-rl; background:var(--s2);border:1px solid var(--line2);border-right:0;border-radius:8px 0 0 8px; padding:10px 4px;color:var(--ink-subtle);font-size:11px;display:flex;gap:6px;align-items:center;z-index:15}
.caption{position:absolute;right:16px;bottom:12px;font-size:11px;color:var(--ink-subtle);background:var(--canvas); border:1px solid var(--line1);border-radius:6px;padding:2px 8px;z-index:40}
.menu{position:absolute;right:0;top:32px;z-index:30;width:320px;background:var(--s3);border:1px solid var(--line2); border-radius:8px;padding:4px;box-shadow:inset 0 1px 0 rgba(247,248,248,.04)}
.menu[hidden]{display:none}
.menu .mi:hover{background:var(--s4)}
.menu .mi[aria-disabled="true"]{color:var(--ink-tertiary)}
.menu .cap{padding:6px 8px 4px;font-size:11px;color:var(--ink-subtle)}
:is(.v-home,.v-workflows,.v-workflow-project,.v-workflow-incident,.v-item-sheet,.v-recipes,.v-recipe-inspector,.v-agents,.v-system) .pagehead{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 0 10px;gap:16px}
.v-home .ny{display:grid;grid-template-columns:104px minmax(0,1fr) 60px 492px;gap:12px;align-items:center; padding:6px 16px;border-top:1px solid var(--line1)}
.v-home .cmd{display:inline-flex;align-items:stretch;margin-top:4px;min-height:24px;border:1px solid var(--line1);border-radius:6px;background:var(--canvas);max-width:100%}
.v-home .run .hint{grid-column:1/-1;color:var(--ink-subtle);font-size:12px}
:is(.v-home,.v-workflows,.v-workflow-project,.v-workflow-incident,.v-item-sheet,.v-recipes,.v-context,.v-context-filemap,.v-agents,.v-system) .sheet{position:fixed;top:48px;right:0;bottom:0;width:520px;background:var(--s1);border-left:1px solid var(--line2);z-index:25; display:flex;flex-direction:column}
:is(.v-home,.v-workflows,.v-workflow-project,.v-workflow-incident,.v-item-sheet,.v-recipes,.v-recipe-inspector,.v-context,.v-context-filemap,.v-system) .menu .mi{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 8px;border-radius:6px;color:var(--ink);width:100%;text-align:left}
:is(.v-home,.v-workflows,.v-workflow-project,.v-workflow-incident,.v-item-sheet,.v-recipes,.v-recipe-inspector,.v-context,.v-context-filemap,.v-system) .menu .mi small{color:var(--ink-subtle);font-size:11px}
.v-home .wf{display:grid;grid-template-columns:14px 238px 150px 200px 60px minmax(0,1fr) auto;gap:12px;align-items:center; min-height:32px;padding:4px 16px;border-top:1px solid var(--line1)}
.v-home .wf:first-of-type{border-top:0}
.v-home .wf:hover{background:var(--s2)}
.v-home .wf .subj{font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-home .wf .subj .team{color:var(--ink-subtle)}
.v-home .wf .recipe{font-family:var(--mono);font-size:12px;letter-spacing:-.1px;color:var(--ink-subtle);white-space:nowrap}
.v-home .wf .stage{color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-home .wf .stage .mono{color:var(--ink)}
.v-home .wf .stage .badge{color:var(--ink-subtle)}
.v-home .wf .age{color:var(--ink-subtle);font-size:12px;white-space:nowrap}
.v-home .wf .now{color:var(--ink-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.v-home .wf .now .mono{color:var(--ink-muted)}
.v-home .wf .acts{min-width:0}
.v-home .wfmore{padding:6px 16px 7px 42px;border-top:1px solid var(--line1);font-size:12px}
.v-home .wfmore a{color:var(--ink-subtle)}
.v-home .wfmore a:hover{color:var(--ink-muted)}
.v-home .motion,.v-home .since,.v-home .pending{font-size:12px}
.v-home .ny{grid-template-columns:104px minmax(0,1fr) 60px 420px}
.v-home .split .main.is-focused{position:relative;z-index:1}
.v-home .cmd{cursor:pointer;text-align:left}
.v-home .cmd .cp{padding:0 8px;border-left:1px solid var(--line1);color:var(--ink-subtle);display:flex;align-items:center}
.v-home .cmd:hover{border-color:var(--line2)}
.v-home .cmd:hover .cp{color:var(--ink);background:var(--s3)}
.v-home .cmd:active .cp{background:var(--s2)}
.v-home .btn,.v-home .cmd,.v-home .cmd .cp,.v-home .ny,.v-home .run,.v-home .q,.v-home .wf,.v-home .seg a,.v-home .wfmore a,.v-home .qfoot a,.v-home .phead .meta a{transition:background-color 120ms cubic-bezier(.25,1,.5,1),border-color 120ms cubic-bezier(.25,1,.5,1),color 120ms cubic-bezier(.25,1,.5,1)}
:is(.v-home,.v-workflows,.v-context,.v-context-filemap,.v-system) .btn:active{background:var(--s2);border-color:var(--line3)}
:is(.v-home,.v-workflows) .btn.term:active{background:var(--s1)}
@media (max-width:1100px){.v-home .row2{grid-template-columns:1fr}
.v-home .ny{grid-template-columns:104px minmax(0,1fr) 60px}
.v-home .ny .acts{grid-column:2/-1;justify-content:flex-start;flex-wrap:wrap;padding-bottom:4px}
.v-home .wf{grid-template-columns:14px minmax(0,1fr) 150px minmax(0,1fr) auto}
.v-home .wf .stage,.v-home .wf .age{display:none}}
:is(.v-workflows,.v-workflow-project,.v-workflow-incident,.v-item-sheet,.v-recipes,.v-recipe-inspector,.v-context,.v-context-filemap,.v-agents,.v-system) .ny{display:grid;grid-template-columns:104px minmax(0,1fr) 60px 492px;gap:12px;align-items:center; padding:6px 16px;border-top:1px solid var(--line1)}
:is(.v-workflows,.v-workflow-project,.v-workflow-incident,.v-item-sheet,.v-recipes,.v-recipe-inspector,.v-context,.v-context-filemap,.v-agents,.v-system) .cmd{display:inline-flex;align-items:stretch;margin-top:4px;min-height:24px;border:1px solid var(--line1);border-radius:6px;background:var(--canvas);max-width:100%}
:is(.v-workflows,.v-workflow-project,.v-workflow-incident) .toolbar{display:flex;align-items:center;gap:8px}
.v-workflows .toolbar .gap{width:8px}
.v-workflows .ghead{display:flex;align-items:center;gap:8px;height:32px;padding:4px 16px;border-top:1px solid var(--line1);background:var(--s2)}
.v-workflows .ghead:first-of-type{border-top:0;border-radius:12px 12px 0 0}
.v-workflows .ghead .rname{font-family:var(--mono);font-size:12px;letter-spacing:-.1px;font-weight:500;color:var(--ink)}
.v-workflows .ghead .rdesc{color:var(--ink-subtle);font-size:12px}
.v-workflows .ghead .rdesc::before{content:"·";margin-right:8px}
.v-workflows .ghead.collapsed{height:34px;border-bottom:0;border-radius:0 0 12px 12px}
.v-workflows .ghead.collapsed .rdesc::before{content:none}
.v-workflows .ghead.collapsed .sepdot{color:var(--ink-subtle);padding:0 4px}
.v-workflows .ghead.collapsed .btn{margin-left:auto}
.v-workflows table.st{width:100%;border-collapse:collapse}
.v-workflows .st th{font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-subtle);text-align:left; padding:5px 8px;white-space:nowrap;border-bottom:1px solid var(--line1)}
.v-workflows .st th.stage{text-transform:none;letter-spacing:-.1px;font-family:var(--mono);font-size:12px;color:var(--ink-muted);font-weight:400}
.v-workflows .st th.subject{width:214px}
.v-workflows .st th.inputs{width:124px}
.v-workflows .st th.now{width:184px}
.v-workflows .st td{padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--line1);height:30px;vertical-align:middle}
.v-workflows .st tbody tr:first-child td{border-top:0}
.v-workflows .st tbody tr:hover td{background:var(--s2)}
.v-workflows .st th:first-child,.v-workflows .st td:first-child{padding-left:16px}
.v-workflows .st th:last-child,.v-workflows .st td:last-child{padding-right:16px}
.v-workflows .st td.subject{font-weight:500;color:var(--ink)}
.v-workflows .st td.subject .team{color:var(--ink-subtle)}

.v-context-filemap .btn,.v-context-filemap .view button,.v-context-filemap .lens input,.v-context-filemap .disc,.v-context-filemap .fm{transition:background-color .12s ease-out,border-color .12s ease-out,color .12s ease-out}

.v-agents .btn.danger:hover{color:var(--error);border-color:var(--error)}

.v-agents .ba{grid-template-columns:104px 70px 48px 84px 64px 118px 1fr}
.v-agents .phead .meta .btn{height:28px}

.v-agents .bud .meter{display:flex}
.v-agents .bud .meter .trk{width:100%}
.v-agents .bud .v{font-family:var(--mono);font-size:12px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.v-agents .bud .v small{font-family:var(--sans);color:var(--attn);font-size:11px;margin-left:6px}
.v-agents .bud .key{grid-column:1/-1;color:var(--ink-subtle);font-size:12px;display:flex;gap:14px;margin-top:2px;white-space:nowrap}

.v-agents .row2a{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-top:8px}
.v-agents .btn,.v-agents .tr,.v-agents .ag,.v-agents .menu .mi{transition:background-color 120ms ease-out,border-color 120ms ease-out,color 120ms ease-out}
@media (prefers-reduced-motion:reduce){.v-agents .btn,.v-agents .tr,.v-agents .ag,.v-agents .menu .mi{transition:none}}
.v-system .pagehead .acts{align-self:center}
.v-system .btn,.v-system .disc,.v-system .en,.v-system .hr,.v-system .gn rect{transition:background-color .12s ease-out,border-color .12s ease-out,color .12s ease-out,stroke .12s ease-out}

.v-system .imp ul{list-style:none;margin-top:4px}

.v-system .worker .mono{color:var(--ink-muted)}
.v-system .worker .r{margin-left:auto}
.v-system .en-h,.v-system .en{display:grid;grid-template-columns:92px 168px 156px minmax(0,1fr) 164px 74px 60px;gap:12px;align-items:center;padding:4px 16px}
.v-system .en-h{height:30px;color:var(--ink-subtle);font-size:11px;font-weight:500;letter-spacing:.3px;border-bottom:1px solid var(--line1)}
.v-system .en{min-height:34px;padding-top:5px;padding-bottom:5px;border-top:1px solid var(--line1);font-size:12px}
.v-system .en-h + .en{border-top:0}
.v-system .en:hover{background:var(--s2)}
.v-system .en.sel{background:var(--s3)}
.v-system .en .id{font-family:var(--mono);font-size:12px;color:var(--ink)}
.v-system .en .mono{color:var(--ink-muted);font-size:12px}
.v-system .en .st{color:var(--ink);font-weight:500;white-space:nowrap}
.v-system .en .st .g{margin-right:4px}
.v-system .en .wait,.v-system .en .tim,.v-system .en .rt{color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-system .en .rt .null{color:var(--ink-subtle)}
.v-system .en .hist{color:var(--ink-subtle);text-align:right;white-space:nowrap}

.v-system .pend-line .r{margin-left:auto;display:flex;gap:10px;align-items:center}

.v-system .hr:first-of-type{border-top:0}
.v-system .hr:hover{background:var(--s2)}
.v-system .hr .ts{color:var(--ink-subtle)}
.v-system .hr .ev{color:var(--ink)}
.v-system .hr .dt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-system .hr .led{color:var(--ink-subtle);white-space:nowrap}
.v-system .hr.more{grid-template-columns:1fr auto;color:var(--ink-subtle);font-family:var(--sans)}

.v-system .svc .sum{display:inline-flex;gap:10px;align-items:center;color:var(--ink-muted);font-size:12px;margin-left:4px}

.v-system .svc .sum .g{width:auto}

/* ===== prototype-only layer (not from the mockups) ===== */
:root{--sheetw:760px;--ts:1}
body{overflow-x:hidden;position:relative;min-height:100vh}
#app{zoom:var(--ts)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[data-row]:focus-visible,.px-rec:focus-visible,.nd:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.px-link{color:var(--brand-hover);font-size:12px;text-align:left}
.px-link:hover{text-decoration:underline}
button.px-link.key{font-family:var(--mono);color:var(--ink);font-size:12px}
.wfmore .px-link{color:var(--ink-subtle)}
.kv dd .px-link{font-size:12px}
.attn-band.pulsing{animation:px-band 1.6s ease-in-out infinite}
@keyframes px-band{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes px-pulse{0%,100%{background-color:rgba(242,153,74,.14)}50%{background-color:rgba(242,153,74,.04)}}
.ny.pulse{animation:px-pulse 1.6s ease-in-out infinite}
.ny .newword{display:inline}
.ny.colour .newword,.ny.calm .newword{display:none}
.blink{animation:px-blink 1s steps(2) infinite}
@keyframes px-blink{50%{opacity:.25}}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:0s!important;transition-delay:0s!important;scroll-behavior:auto!important}
html.rm .ny.pulse{outline:2px solid var(--attn);outline-offset:-2px;background:var(--attn-soft)}
html.rm .attn-band.pulsing{opacity:1}
.stale .ny,.stale .wf,.stale .run,.stale .q{opacity:.55}
/* banners and shared states */
.px-banner{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--s2);margin:0 0 8px}
.px-banner.err{border-color:var(--error);background:var(--s3)}
.px-banner .w{font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.px-banner .t{color:var(--ink-muted);flex:1}
.px-banner code{font-family:var(--mono);font-size:12px;color:var(--ink)}
.px-banner .aside{color:var(--ink-subtle);font-size:12px;max-width:260px}
.px-prog{display:block;height:4px;border-radius:2px;background:var(--line1);overflow:hidden}
.px-prog i{display:block;height:100%;background:var(--brand-hover)}
.px-center{display:grid;place-items:center;min-height:60vh}
.px-card{max-width:520px;width:100%;background:var(--s1);border:1px solid var(--line2);border-radius:12px;padding:20px}
.px-card h2{font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center}
.px-card p{color:var(--ink-muted);margin-top:8px}
.px-card .help{color:var(--ink-subtle);font-size:12px}
.px-vers{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin-top:10px}
.px-vers .k{color:var(--ink-subtle)}
.px-skrow{display:flex;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line1)}
.sk{display:inline-block;height:12px;border-radius:4px;background:var(--s3);min-width:60px}
/* inline confirms, forms, jobs */
.px-confirm{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:6px;padding:8px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--s2);font-size:12px;color:var(--ink-muted)}
.px-confirm b{color:var(--ink);font-weight:500}
.px-confirm .acts{margin-left:auto;display:flex;gap:6px;flex:none}
.px-confirm.inl{margin:0;padding:3px 6px;display:inline-flex}
.btn.danger{color:var(--error)}
.btn.danger:hover{border-color:var(--error)}
.px-sent,.px-att{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted)}
.px-att{height:28px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--s2);color:var(--ink)}
.px-note{font-size:12px;color:var(--ink-muted);margin-top:4px}
.px-job{margin-top:6px;padding:6px 10px;border:1px solid var(--line1);border-radius:6px;background:var(--canvas);font-family:var(--mono);font-size:12px;color:var(--ink-muted);display:flex;flex-direction:column;gap:2px;max-width:560px}
.px-in,.px-ta,.px-fin{background:var(--canvas);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;color:var(--ink);font-size:13px;min-height:28px}
.px-ta{width:100%;resize:vertical;font-family:var(--sans);line-height:1.4}
.px-fin{border:0;background:none;padding:0;min-height:0;flex:1;min-width:0}
.filter .px-fin::placeholder{color:var(--ink-subtle)}
.px-formrow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.px-formrow .note{font-size:12px;color:var(--ink-subtle)}
.px-lbl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-subtle);margin-top:8px}
select.px-in{height:28px}
.px-popwrap{position:relative;display:inline-flex}
.px-pop{position:absolute;right:0;top:34px;z-index:40;width:340px;background:var(--s3);border:1px solid var(--line2);border-radius:12px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.px-pop h3{font-size:13px;font-weight:600}
.px-pop p{color:var(--ink-muted);font-size:12px;margin-top:4px}
.px-recs{display:flex;flex-direction:column;gap:2px;margin-top:8px;max-height:180px;overflow:auto}
.px-rec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 8px;border-radius:6px;font-family:var(--mono);font-size:12px;text-align:left}
.px-rec small{color:var(--ink-subtle);font-family:var(--sans);font-size:11px}
.px-rec[aria-checked="true"]{background:var(--s4);outline:1px solid var(--line3)}
.px-rec:hover{background:var(--s4)}
.px-res{margin-top:8px;font-size:12px;color:var(--ink-muted);display:flex;gap:6px;align-items:baseline}
.px-quotes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.px-quotes>div{border:1px solid var(--line2);border-radius:8px;padding:8px;font-size:12px;color:var(--ink-muted)}
.px-quotes b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.px-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;background:var(--s3);border:1px solid var(--line2);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--ink)}
.px-chord{position:fixed;top:14px;left:50%;z-index:90;font-size:12px;color:var(--ink-muted);display:none;align-items:center;gap:4px}
.px-chord.on{display:inline-flex}
/* sheet: resizable 420..760, full width below 1100 */
.shw .sheet{width:var(--sheetw)!important;min-width:min(420px,100%)}
.page.behind{max-width:none!important;margin:0!important;padding-right:calc(var(--sheetw) + 8px)!important}
.page.behind .pagehead{flex-wrap:wrap;align-items:center;gap:8px 16px}
.page.behind .hints{display:none}
.page.behind .panel{overflow-x:auto}
.sheet-grip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:3}
.sheet-grip:hover,.sheet-grip:focus-visible{background:rgba(130,143,255,.3)}
.sheetback{display:none;margin-right:4px}
.sheetback.show{display:inline-flex}
.sheet .tab{cursor:pointer}
@media (max-width:1100px){
  .shw .sheet{width:100%!important;border-left:0}
  .page.behind{padding-right:16px!important}
  .sheetback{display:inline-flex}
  .sheet-grip{display:none}
}
.v-home.narrow .row2{grid-template-columns:1fr}
.v-home.narrow .ny{grid-template-columns:104px minmax(0,1fr) 60px}
.v-home.narrow .ny .acts{grid-column:2/-1;justify-content:flex-start;flex-wrap:wrap;padding-bottom:4px}
.v-home.narrow .wf{grid-template-columns:14px minmax(0,1fr) 150px minmax(0,1fr) auto}
.v-home.narrow .wf .stage,.v-home.narrow .wf .age{display:none}
.v-home.narrow .strip{grid-template-columns:repeat(3,1fr)}
.v-home .px-job{max-width:none}
.nd{cursor:pointer;outline:none}
.nd:hover rect{stroke:var(--line3)}
.nd.sel rect,.v-context .node.sel{stroke:var(--focus)!important;stroke-width:2!important}
.nd:focus-visible rect{stroke:var(--focus);stroke-width:2}
.gn:focus-visible rect{stroke:var(--focus);stroke-width:2}
.disc{cursor:pointer;color:var(--ink-subtle)}
/* palette and dialogs (not a first thought: the palette and the two rev 7 dialogs only) */
.px-scrim{position:fixed;inset:0;z-index:80;background:rgba(1,1,2,.55)}
.px-pal{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:620px;max-width:calc(100vw - 32px);background:var(--s3);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.px-palin{display:flex;align-items:center;gap:8px;padding:0 14px;height:46px;border-bottom:1px solid var(--line1);color:var(--ink-subtle)}
.px-palin input{flex:1;height:100%;color:var(--ink);font-size:14px}
.px-palin input::placeholder{color:var(--ink-subtle)}
.px-palist{max-height:400px;overflow:auto;padding:4px}
.px-palsec{padding:8px 10px 4px;font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-subtle)}
.px-palit{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;color:var(--ink);cursor:pointer}
.px-palit .s{color:var(--ink-subtle);font-size:12px;margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.px-palit .k{display:flex;gap:3px;flex:none}
.px-palit .g{width:14px;text-align:center;color:var(--ink-subtle);font-size:11px;flex:none}
.px-palit.on{background:var(--s4);outline:1px solid var(--line3);outline-offset:-1px}
.px-palit.dis{color:var(--ink-subtle);cursor:not-allowed}
.px-palfoot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line1);font-size:11px;color:var(--ink-subtle)}
.px-palfoot span{display:flex;gap:4px;align-items:center}
.px-palempty{padding:18px;text-align:center;color:var(--ink-muted)}
.px-dlg{position:absolute;left:50%;top:120px;transform:translateX(-50%);width:460px;max-width:calc(100vw - 32px);background:var(--s3);border:1px solid var(--line2);border-radius:12px;padding:18px}
.px-dlg h2{font-size:15px;font-weight:600}
.px-dlg p{color:var(--ink-muted);margin-top:8px}
.px-keys{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.px-keys>div{display:flex;gap:12px;align-items:center}
.px-keys>div>span:first-child{width:150px;display:flex;gap:4px;flex:none}
.px-keys>div>span:last-child{color:var(--ink-muted)}
/* the fixed controls panel */
#proto{position:fixed;left:12px;bottom:12px;z-index:95;width:292px;background:#0b0b0d;border:1px dashed #4a4a52;border-radius:10px;font-size:12px;color:var(--ink-muted)}
#proto.collapsed{width:auto}
#proto .ph2{display:flex;align-items:center;gap:8px;padding:7px 10px;width:100%;text-align:left;border-radius:10px}
#proto .ph2 b{font-weight:600;color:var(--ink);font-size:11px;letter-spacing:.4px;text-transform:uppercase}
#proto .ph2 span{color:var(--ink-subtle);font-size:11px}
#proto .pb{padding:6px 10px 10px;border-top:1px dashed #33333a;display:flex;flex-direction:column;gap:8px}
#proto.collapsed .pb{display:none}
#proto .lbl{font-size:11px;color:var(--ink-subtle);letter-spacing:.3px;text-transform:uppercase;margin-top:2px}
#proto .states{display:flex;flex-wrap:wrap;gap:4px}
#proto .states button{height:24px;padding:0 8px;border:1px solid var(--line2);border-radius:5px;font-size:11px;color:var(--ink-muted);background:var(--s2)}
#proto .states button[aria-pressed="true"]{border-color:var(--brand-hover);color:var(--ink);background:#1d2036}
#proto label{display:flex;gap:8px;align-items:center;cursor:pointer}
#proto input[type=checkbox]{accent-color:#828fff;width:13px;height:13px}
#proto input[type=range]{accent-color:#828fff;flex:1}
#proto .reset{align-self:flex-start}
</style>
</head>

  </div>
</aside>

function drawCtx(){
  const stack=$('.stack'); if(!stack) return; const Sx=stack.getBoundingClientRect(); const z=parseFloat(getComputedStyle($('#app')).zoom)||1;
  const box=el=>{ const r=el.getBoundingClientRect(); return {l:(r.left-Sx.left)/z,r:(r.right-Sx.left)/z,t:(r.top-Sx.top)/z,b:(r.bottom-Sx.top)/z,cx:((r.left+r.right)/2-Sx.left)/z}; };
  const node=id=>stack.querySelector('[data-node="'+id+'"]'); const ov=stack.querySelector('.xedges'); if(!ov) return;
  const W=Math.round(Sx.width/z), H=Math.round(Sx.height/z); ov.setAttribute('width',W); ov.setAttribute('height',H); ov.setAttribute('viewBox','0 0 '+W+' '+H);
  ov.querySelectorAll('path[data-from]').forEach(p=>{
    const a=node(p.dataset.from), b=node(p.dataset.to); if(!a||!b||!a.closest('.band')||!b.closest('.band')){ p.removeAttribute('d'); const lb=ov.querySelector('text[data-edge="'+p.dataset.edge+'"]'); lb&&lb.setAttribute('visibility','hidden'); return; }
    const lb0=ov.querySelector('text[data-edge="'+p.dataset.edge+'"]'); lb0&&lb0.removeAttribute('visibility');
    const A_=box(a), B_=box(b), down=p.dataset.dir!=='up'; const y1=down?A_.b:A_.t, y2=down?B_.t:B_.b; const ol=Math.max(A_.l,B_.l), or=Math.min(A_.r,B_.r); let x,d;
    if(p.dataset.at&&or-ol>=24){ x=ol+(or-ol)*parseFloat(p.dataset.at); d='M'+x+' '+y1+'V'+y2; }
    else if(A_.cx>=B_.l+8&&A_.cx<=B_.r-8){ x=A_.cx; d='M'+x+' '+y1+'V'+y2; }
    else if(or-ol>=24){ x=(ol+or)/2; d='M'+x+' '+y1+'V'+y2; }
    else { const ga=box(a.closest('.band')), gb=box(b.closest('.band')); const my=down?(ga.b+gb.t)/2:(gb.b+ga.t)/2; x=B_.cx; d='M'+A_.cx+' '+y1+'V'+my+'H'+x+'V'+y2; }
    p.setAttribute('d',d);
    const lab=ov.querySelector('text[data-edge="'+p.dataset.edge+'"]'); if(lab){ const up=box((down?a:b).closest('.band')), lo=box((down?b:a).closest('.band')); lab.setAttribute('x',x+6); lab.setAttribute('y',(up.b+lo.t)/2+4); }
  });
  const c=stack.querySelector('.conflict'), dn=node('int-decision');

}

function parseHash(h){

  if(a==='workflow') return {route:'workflows',sheet:{kind:'wf',id:rest}};
  if(a==='item') return {route:'work',sheet:{kind:'item',id:rest}};
  if(a==='recipe') return {route:'recipes',sheet:{kind:'recipe',id:rest}};
  if(a==='node'){ const id=Object.keys(CN).find(k=>CN[k][0]===rest)||(CN[rest]?rest:'prod-anchor'); return {route:'context',sheet:{kind:'node',id}}; }

}

function palFilter(){

  if((e.metaKey||e.ctrlKey)&&k.toLowerCase()==='n'){ e.preventDefault(); go('workflows'); openStart(); return; }
  if((e.metaKey||e.ctrlKey)&&k.toLowerCase()==='z'){ if(S.toast){ e.preventDefault(); ACTS['undo-det'](); } else if(S.undoSeen){ e.preventDefault(); ACTS['undo-seen'](); } return; }
  if((e.metaKey||e.ctrlKey)&&k==='Enter'){ const ta=document.activeElement; if(ta&&ta.id==='ans'&&S.sheet){ e.preventDefault(); doAnswer(S.sheet.id); } return; }
  if(k==='Escape'){
    if(S.confirm){ e.preventDefault(); const kk=S.confirm; S.confirm=null; render({nofocus:true}); const id=kk.split(':')[1]; const el=$('[data-act="ask-cancel"][data-id="'+id+'"]')||$('[data-act="menu"][data-id="agm:'+id+'"]')||$('[data-row="ny:'+id+'"]')||$('[data-act="menu"][data-id="sub:'+id+'"]'); el&&el.focus(); live('Kept. Nothing changed'); return; }
    if(S.menu){ e.preventDefault(); const id=S.menu; S.menu=null; render({nofocus:true}); const el=$('[data-act="menu"][data-id="'+id+'"]')||$('[data-act="vers"]')||$('[data-act="win"]'); el&&el.focus(); return; }
    if(S.pop){ e.preventDefault(); S.pop=null; render({nofocus:true}); const el=$('[data-act="start"],[data-act="create"],[data-act="validate"],[data-act="import"],[data-act="conflict"]'); el&&el.focus(); return; }
    if(S.sheet){ e.preventDefault(); closeSheet(); return; }
    return;
  }
  const a=document.activeElement;
  if(typing(a)) return;
  if(['notrunning','mismatch','connecting'].includes(S.conn)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(chord){
    const m={n:'needs',h:'home',w:'workflows',q:'work',r:'recipes',c:'context',a:'agents','.':'system',s:'system',d:'home'}; const d=m[k.toLowerCase()]; setChord(false);
    if(d){ e.preventDefault(); if(d==='needs') goNeeds(); else { go(d); const f=$('[data-row]'); f&&f.focus({preventScroll:true}); } }
    return;
  }
  if(S.menu&&(k==='ArrowDown'||k==='ArrowUp')){ e.preventDefault(); const its=$$('.menu .mi:not([disabled])'); const i=its.indexOf(a); const n=its[(i+(k==='ArrowDown'?1:-1)+its.length)%its.length]; n&&n.focus(); return; }
  if(a&&a.dataset&&a.dataset.grip!==undefined&&(k==='ArrowLeft'||k==='ArrowRight')){ e.preventDefault(); S.sheetW=Math.max(420,Math.min(760,S.sheetW+(k==='ArrowLeft'?20:-20))); render(); const g=$('.sheet-grip'); g&&g.focus(); return; }
  const x=focusedItem();
  switch(true){
    case (k==='g'||k==='G')&&!e.shiftKey: e.preventDefault(); setChord(true); break;
    case k==='j'||k==='ArrowDown': if(!a.closest('.menu')&&!a.closest('.sheet')){ e.preventDefault(); moveRow(1); } break;
    case k==='k'||k==='ArrowUp': if(!a.closest('.menu')&&!a.closest('.sheet')){ e.preventDefault(); moveRow(-1); } break;
    case k==='Enter': { const row=a&&a.closest&&a.closest('[data-row]'); if(row&&a===row&&!a.closest('.sheet')){ e.preventDefault(); rowEnter(row); } break; }
    case k==='?': e.preventDefault(); openKeys(); break;
    case k==='A'&&e.shiftKey: e.preventDefault(); ACTS['seen-all'](); break;
    case k==='a': { e.preventDefault(); const row=a&&a.closest&&a.closest('[data-row]'); if(x&&x.g==='park'&&(x.reason==='needs-answer'||x.reason==='no-progress')) openSheet('item',x.id,{fresh:true,answer:true}); else if(row&&row.dataset.row.startsWith('wf:')&&rootBy(row.dataset.row.slice(3)).desk) openSheet('wf',row.dataset.row.slice(3),{fresh:true}); else if(x&&x.g==='decision'&&S.sheet) doDecide(x.id,'accept'); else if(x&&x.g==='withyou') doHandback(x.id); else live('Open the row first (Enter), or use its button'); break; }
    case k==='o': { e.preventDefault(); if(x&&x.g==='running'&&x.term) doAttach(x.id); else if(x&&x.g!=='cancelled') doLaunch(x.id,x.tgt); break; }
    case k==='t': { e.preventDefault(); if(x&&x.g==='running') doTakeover(x.id); break; }
    case k==='b': { e.preventDefault(); if(x&&x.g==='withyou') doHandback(x.id); break; }
    case k==='x': { e.preventDefault(); if(x&&!['cancelled'].includes(x.g)){ S.confirm=(S.sheet?'cancelsub:':'cancel:')+x.id; render({nofocus:true}); const kp=$('[data-act="confirm-no"]'); kp&&kp.focus(); } break; }
    case k==='y': { e.preventDefault(); const c=$('.cmd',a&&a.closest&&a.closest('[data-row]')||document); if(c) doCopy(c.dataset.cli,c.dataset.x); else live('This row has no command to copy'); break; }
    case k==='c': { if(S.route==='work'){ e.preventDefault(); ACTS.create(); } break; }
    case k==='/': { if(S.route==='work'){ e.preventDefault(); const f=$('#wkfilter'); f&&f.focus(); } break; }
    case k==='e': { if(S.sheet&&S.sheet.kind==='recipe'){ e.preventDefault(); ACTS.evals(); } else if(S.route==='system'){ const t=$('#eng-h'); t&&t.scrollIntoView(); live('Engine'); } break; }
    case k==='s': { if(S.route==='context'&&S.ctx.props.length){ e.preventDefault(); mrDo(S.ctx.props[0].id,'skip'); } break; }
    case k==='r': { if(x&&x.g==='running'&&x.term){ e.preventDefault(); ACTS['req-form']({dataset:{id:x.id}}); } break; }
  }
});
/* resizing the sheet by dragging its left edge (420 to 760) */
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-grip]'); if(!g) return; e.preventDefault(); g.setPointerCapture(e.pointerId);
  const mv=ev=>{ const z=parseFloat(getComputedStyle($('#app')).zoom)||1; const w=Math.round((window.innerWidth-ev.clientX)/z); S.sheetW=Math.max(420,Math.min(760,w)); document.documentElement.style.setProperty('--sheetw',S.sheetW+'px'); };
  const up=()=>{ g.removeEventListener('pointermove',mv); g.removeEventListener('pointerup',up); render(); const n=$('.sheet-grip'); n&&n.focus(); live('Sheet width '+S.sheetW+' pixels'); };
  g.addEventListener('pointermove',mv); g.addEventListener('pointerup',up);
});
/* seen after one second of focus */
document.addEventListener('focusin',e=>{ const row=e.target.closest&&e.target.closest('[data-row]'); if(row){ if(S.focusKey!==row.dataset.row){ S.focusKey=row.dataset.row; S.focusSince=Date.now(); } } });
setInterval(()=>{ const k=S.focusKey; if(!k||!k.startsWith('ny:')) return; const a=document.activeElement; const row=a&&a.closest&&a.closest('[data-row]'); if(!row||row.dataset.row!==k) return; const n=needs().find(q=>q.key===k.slice(3)); if(n&&isPulse(n)&&!S.seen.has(n.key)&&Date.now()-S.focusSince>=1000){ S.seen.add(n.key); render(); } },300);
/* ───────── prototype controls ───────── */
const CONNS=[['normal','Normal'],['notrunning','Not running'],['connecting','Connecting'],['mismatch','Version mismatch'],['stale','Stale'],['rebuilding','Rebuilding'],['stalled','Stalled']];
$('#connStates').innerHTML=CONNS.map(c=>'<button data-conn="'+c[0]+'" aria-pressed="false">'+c[1]+'</button>').join('');
$('#connStates').addEventListener('click',e=>{ const b=e.target.closest('[data-conn]'); if(!b) return; S.conn=b.dataset.conn; S.menu=null; S.pop=null; if(['notrunning','mismatch','connecting'].includes(S.conn)) S.sheet=null; S.rebuildPct=28; live('State: '+b.textContent); render(); if(S.conn==='rebuilding') { const t=setInterval(()=>{ if(S.conn!=='rebuilding'){ clearInterval(t); return; } S.rebuildPct=Math.min(96,S.rebuildPct+3); render({nofocus:true}); },900); } });
$('#optRm').addEventListener('change',e=>{ S.rm=e.target.checked; render(); live('Reduced motion '+(S.rm?'on':'off')); });
$('#optScale').addEventListener('input',e=>{ S.ts=+e.target.value; $('#scaleVal').textContent=S.ts.toFixed(1); render(); });
$('#optLarge').addEventListener('change',e=>{ S.large=e.target.checked; const c=S.conn; load(S.large); S.conn=c; nav(S.route,true); render({fresh:true}); live(S.large?'Large fixture: '+needs().length+' need you':'Normal fixture'); });
$('#optReset').addEventListener('click',()=>{ S.conn='normal'; S.large=false; S.ts=1; S.rm=matchMedia('(prefers-reduced-motion: reduce)').matches; S.sheetW=760; S.last=null; load(false); $('#scaleVal').textContent='1.0'; history.replaceState({route:'home'},'','#home'); S.route='home'; render({fresh:true}); live('Fixture reset: '+needs().length+' need you'); });
$('#protoToggle').addEventListener('click',()=>{ const p=$('#proto'); const c=p.classList.toggle('collapsed'); $('#protoToggle').setAttribute('aria-expanded',!c); });
['click','keydown','pointerdown'].forEach(t=>$('#proto').addEventListener(t,e=>e.stopPropagation()));
function syncProto(){ $$('#connStates [data-conn]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.conn===S.conn)); $('#optRm').checked=S.rm; $('#optLarge').checked=S.large; $('#optScale').value=S.ts; }
/* ───────── boot ───────── */
(function boot(){
  let h=location.hash.replace(/^#/,'');
  if(!h){ try{ h=localStorage.getItem('sindri.proto.last')||'home'; }catch(e){ h='home'; } history.replaceState({route:h},'','#'+h); }
  applyHash('#'+h,null,true);
  document.fonts&&document.fonts.ready&&document.fonts.ready.then(()=>{ if(S.route==='context') drawCtx(); });
  window.addEventListener('resize',()=>{ if(S.route==='context') drawCtx(); });
  setTimeout(()=>live(needs().length+' now need you'),400);
})();

</script>
